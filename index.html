<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A simple case register for insurance surveyors — track insurance, insured party, visit, status and payment details per case, stored in a shared database.">
<title>Case Register — Insurance Surveyor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231E2735'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' fill='%23F7F5EF' text-anchor='middle'%3E%C2%A7%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --paper:#F7F5EF;
    --paper-raised:#FFFFFF;
    --ink:#1E2735;
    --ink-soft:#586170;
    --line:#DCD5C0;
    --line-soft:#EAE4D2;
    --stamp-red:#AD3A2E;
    --stamp-red-soft:#F3E1DD;
    --ledger-green:#3A6B4C;
    --ledger-green-soft:#DDE9DF;
    --amber:#9C6B24;
    --amber-soft:#F1E3C6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;height:100%;font-size:14.5px;line-height:1.45;}
  #app{display:flex;min-height:100vh;}
  button{font-family:'Inter',sans-serif;}
  code{background:#EFEADA;padding:1px 5px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:.92em;}

  /* ---------- Sidebar ---------- */
  #sidebar{width:300px;flex:0 0 300px;background:var(--paper-raised);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:100vh;}
  .sidebar-head{padding:22px 20px 16px;border-bottom:1px solid var(--line);}
  .brand-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);}
  .brand-title{font-family:'Zilla Slab',serif;font-size:21px;font-weight:700;margin-top:2px;line-height:1.2;}
  .total-row{margin-top:12px;display:flex;align-items:baseline;gap:8px;}
  .total-num{font-family:'Zilla Slab',serif;font-size:26px;font-weight:700;color:var(--stamp-red);}
  .total-label{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}

  .sidebar-controls{padding:14px 16px;border-bottom:1px solid var(--line);}
  #search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:5px;background:var(--paper);font-size:13.5px;color:var(--ink);}
  #search:focus{outline:2px solid var(--ink);outline-offset:1px;}
  #newCaseBtn{width:100%;margin-top:10px;padding:10px 12px;border:none;border-radius:5px;background:var(--ink);color:#fff;font-weight:600;font-size:13.5px;cursor:pointer;letter-spacing:.01em;}
  #newCaseBtn:hover{background:#31404F;}
  #newCaseBtn:focus-visible{outline:2px solid var(--stamp-red);outline-offset:2px;}

  #caseList{flex:1;overflow-y:auto;padding:10px 0;}
  .case-tab{position:relative;margin:0 12px 8px;padding:10px 12px 10px 14px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:4px;cursor:pointer;transition:.12s;}
  .case-tab:hover{border-left-color:var(--ink-soft);}
  .case-tab.active{background:var(--ink);border-left-color:var(--stamp-red);}
  .case-tab.active .ct-id, .case-tab.active .ct-company{color:#fff;}
  .case-tab.active .ct-meta{color:#B9C0CC;}
  .ct-id{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .ct-company{font-family:'Zilla Slab',serif;font-size:15px;font-weight:600;margin-top:1px;}
  .ct-meta{font-size:11px;color:var(--ink-soft);margin-top:5px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .status-chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;}
  .empty-side{padding:24px 20px;color:var(--ink-soft);font-size:13px;line-height:1.6;}

  .sidebar-foot{border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
  #saveStatusRow{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);}
  .save-dot{width:7px;height:7px;border-radius:50%;background:var(--ledger-green);flex:0 0 7px;}
  .save-dot.busy{background:var(--amber);}
  .save-dot.err{background:var(--stamp-red);}
  .storage-note{font-size:10.5px;color:var(--ink-soft);line-height:1.5;}
  .backup-row{display:flex;gap:8px;}
  .ghost-btn{flex:1;border:1px solid var(--line);background:var(--paper-raised);border-radius:5px;padding:7px 8px;font-size:12px;cursor:pointer;color:var(--ink-soft);font-weight:500;}
  .ghost-btn:hover{border-color:var(--ink);color:var(--ink);}
  .ghost-btn:focus-visible{outline:2px solid var(--stamp-red);outline-offset:2px;}

  /* ---------- Main ---------- */
  #main{flex:1;padding:32px 40px 60px;min-width:0;}
  .no-case{max-width:440px;margin:80px auto;text-align:center;color:var(--ink-soft);}
  .no-case h2{font-family:'Zilla Slab',serif;color:var(--ink);font-size:22px;}
  .no-case p{font-size:14px;line-height:1.65;}

  .case-header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:20px;border-bottom:2px solid var(--ink);margin-bottom:24px;flex-wrap:wrap;gap:18px;}
  .ch-left{display:flex;gap:16px;align-items:flex-start;}
  .ch-badge{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Zilla Slab',serif;font-weight:700;font-size:17px;flex:0 0 44px;}

  .ch-title-display{font-family:'Zilla Slab',serif;font-size:23px;font-weight:700;color:var(--ink);}
  .ch-sub-display{display:flex;gap:26px;margin-top:10px;flex-wrap:wrap;}
  .field-display label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:3px;}
  .field-display div.val{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink);}
  .bs-inline{font-family:'Inter';color:var(--ink-soft);font-size:11px;margin-left:4px;}

  .ch-title-input{font-family:'Zilla Slab',serif;font-size:23px;font-weight:700;border:none;background:transparent;color:var(--ink);width:340px;max-width:100%;padding:2px 0;border-bottom:1px dashed var(--line);}
  .ch-title-input:focus{outline:none;border-bottom-color:var(--ink);}
  .ch-sub{display:flex;gap:22px;margin-top:10px;flex-wrap:wrap;}
  .field-inline{display:flex;flex-direction:column;gap:3px;}
  .field-inline label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
  .field-inline input{border:none;border-bottom:1px solid var(--line);background:transparent;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink);padding:3px 0;width:126px;}
  .field-inline input:focus{outline:none;border-bottom-color:var(--ink);}
  .bs-hint{font-size:10.5px;color:var(--ink-soft);margin-top:3px;font-family:'Inter';min-height:13px;}
  .bs-hint b{color:var(--ink);font-weight:600;}

  .ch-actions{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;}
  .icon-btn{border:1px solid var(--line);background:var(--paper-raised);border-radius:5px;padding:8px 12px;font-size:12px;cursor:pointer;color:var(--ink-soft);font-weight:500;}
  .icon-btn:hover{border-color:var(--stamp-red);color:var(--stamp-red);}
  .icon-btn:focus-visible{outline:2px solid var(--stamp-red);outline-offset:2px;}
  .icon-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .icon-btn.primary:hover{background:#31404F;color:#fff;border-color:#31404F;}

  .stamp{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border:1.5px solid currentColor;}
  .stamp.submitted{color:var(--ledger-green);}
  .stamp.process{color:var(--amber);}
  .stamp.none{color:var(--ink-soft);}

  /* accordion sections */
  .section{margin-bottom:16px;border:1px solid var(--line);border-radius:7px;background:var(--paper-raised);overflow:hidden;}
  .section-head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:var(--paper-raised);border:none;cursor:pointer;text-align:left;}
  .section-head:hover{background:#FBFAF5;}
  .section-head:focus-visible{outline:2px solid var(--stamp-red);outline-offset:-2px;}
  .section-title{font-family:'Zilla Slab',serif;font-size:15px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:10px;color:var(--ink);}
  .section-title .num{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#fff;background:var(--ink);width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 18px;}
  .count-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);font-weight:500;}
  .chevron{transition:transform .18s ease;color:var(--ink-soft);font-size:12px;}
  .section.collapsed .chevron{transform:rotate(-90deg);}
  .section-body{padding:0 16px 16px;}
  .section.collapsed .section-body{display:none;}

  .add-row-btn{border:1px dashed var(--line);background:transparent;color:var(--ink-soft);font-size:12px;padding:6px 11px;border-radius:5px;cursor:pointer;margin-top:10px;}
  .add-row-btn:hover{border-color:var(--ink);color:var(--ink);}
  .add-row-btn:focus-visible{outline:2px solid var(--stamp-red);outline-offset:2px;}

  table.grid{width:100%;border-collapse:collapse;border:1px solid var(--line-soft);border-radius:5px;overflow:hidden;}
  table.grid thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding:9px 12px;border-bottom:1px solid var(--line);background:#F1EDE0;font-weight:600;}
  table.grid tbody td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  table.grid td.input-cell{padding:0;}
  table.grid tbody tr:last-child td{border-bottom:none;}
  table.grid tbody tr:hover{background:#FBFAF5;}
  table.grid tbody tr.editing-row{background:#FBF8EE;}
  .cell-input, .cell-select{width:100%;border:none;background:transparent;padding:9px 12px;font-size:13.5px;color:var(--ink);}
  .cell-input:focus, .cell-select:focus{outline:2px solid var(--ink);outline-offset:-2px;background:#fff;}
  .cell-bs{font-size:10.5px;color:var(--ink-soft);padding:0 12px 8px;margin-top:-4px;}
  .cell-bs-inline{font-size:11px;color:var(--ink-soft);}
  .display-cell{font-size:13.5px;color:var(--ink);}
  .display-cell.muted{color:var(--ink-soft);font-style:italic;}
  td.col-actions{width:118px;white-space:nowrap;text-align:right;}
  .mini-btn{border:1px solid var(--line);background:var(--paper-raised);border-radius:4px;padding:5px 10px;font-size:11.5px;cursor:pointer;color:var(--ink-soft);font-weight:500;margin-left:5px;}
  .mini-btn:hover{border-color:var(--ink);color:var(--ink);}
  .mini-btn.save{background:var(--ink);color:#fff;border-color:var(--ink);}
  .mini-btn.save:hover{background:#31404F;}
  .mini-btn:focus-visible{outline:2px solid var(--stamp-red);outline-offset:1px;}
  .del-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;padding:5px 6px;line-height:1;margin-left:3px;}
  .del-btn:hover{color:var(--stamp-red);}
  .empty-grid{padding:18px 14px;font-size:13px;color:var(--ink-soft);font-style:italic;}

  .payment-box{border:1.5px solid var(--stamp-red);border-radius:6px;}
  .payment-box .section-head{background:var(--stamp-red-soft);}
  .payment-box .section-head:hover{background:#F0DAD5;}
  .payment-box table.grid thead th{background:#F3E1DD;}

  select.cell-select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%23586170'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:26px;}

  .toast{position:fixed;bottom:20px;right:26px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:5px;font-size:12.5px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:50;max-width:320px;}
  .toast.show{opacity:1;transform:translateY(0);}

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;}
  #importInput{display:none;}

  @media (max-width:820px){
    #app{flex-direction:column;}
    #sidebar{width:100%;flex:none;min-height:auto;max-height:380px;}
    #main{padding:24px 18px 60px;}
    td.col-actions{width:auto;}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-head">
      <div class="brand-eyebrow">Insurance Surveyor</div>
      <div class="brand-title">Case Register</div>
      <div class="total-row"><span class="total-num" id="totalCases">0</span><span class="total-label">total cases</span></div>
    </div>
    <div class="sidebar-controls">
      <input id="search" type="text" placeholder="Search case ID or company…" autocomplete="off">
      <button id="newCaseBtn">+ New Case</button>
    </div>
    <div id="caseList"></div>
    <div class="sidebar-foot">
      <div id="saveStatusRow"><span class="save-dot" id="saveDot"></span><span id="saveStatusText">Loading…</span></div>
      <div class="storage-note">Data is stored in a shared database — anyone with this site's link can view and edit it, since there's no login. Every field now requires pressing Save. Download a backup regularly.</div>
      <div class="backup-row">
        <button class="ghost-btn" id="exportBtn">Download backup</button>
        <button class="ghost-btn" id="importBtn">Restore backup</button>
      </div>
      <input type="file" id="importInput" accept="application/json">
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>

  const target = new Date(adStr+'T00:00:00');
  if(isNaN(target)) return null;
  let days = Math.round((target - BS_EPOCH_AD)/86400000);
  if(days < 0) return null;
  let year = 2000, month = 0;
  while(true){
    if(month === 12){ month = 0; year++; }
    const yearData = BS_DATA[year];
    if(!yearData) return null;
    const mlen = yearData[month];
    if(days < mlen) break;
    days -= mlen; month++;
  }
  return {year, month: month+1, day: days+1};
}
function bsLabel(adStr){
  const r = adToBs(adStr);
  if(!r) return adStr ? 'B.S. date unavailable for this year' : '';
  return `B.S. ${r.day} ${BS_MONTHS[r.month-1]} ${r.year}`;
}

let cases = [];
let selectedId = null;
const collapsed = {insurance:false, insured:false, visits:false, statuses:false, payments:false};

// Explicit edit-mode state (reset whenever the selected case changes)
let headerEditing = false;
let headerDraft = null;
const editingRows = new Set();   // row ids currently in edit mode
const rowDrafts = {};            // rowId -> snapshot of original values, for Cancel
const pendingNewRows = new Set();// row ids that exist locally only, not yet saved to the database

function resetEditState(){
  headerEditing = false; headerDraft = null;
  editingRows.clear();
  Object.keys(rowDrafts).forEach(k=>delete rowDrafts[k]);

}

const TABLE_CONFIG = {
  insurance: {db:'insurance_details', cols:{insurer:'insurer', insuranceType:'insurance_type', claimDate:'claim_date', policyNo:'policy_no', claimNo:'claim_no'}},
  insured:   {db:'insured_details',   cols:{bankName:'bank_name', personName:'person_name'}},

function dbToJsRow(tKey, row){
  const out = {id: row.id};
  for(const [jsKey, dbCol] of Object.entries(TABLE_CONFIG[tKey].cols)) out[jsKey] = row[dbCol] ?? '';
  return out;
}
function blankRow(tKey){
  const out = {};
  Object.keys(TABLE_CONFIG[tKey].cols).forEach(jsKey=>out[jsKey]='');
  return out;
}

function isConfigured(){ return !!supa; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function nowStamp(){ return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function setSaveStatus(mode, text){
  const dot = document.getElementById('saveDot');
  const label = document.getElementById('saveStatusText');
  if(!dot || !label) return;
  dot.className = 'save-dot' + (mode==='busy' ? ' busy' : mode==='err' ? ' err' : '');
  label.textContent = text;
}

function renderSetupScreen(){
  document.getElementById('app').innerHTML = `<div style="max-width:560px;margin:80px auto;padding:0 24px;text-align:center;">
    <h2 style="font-family:'Zilla Slab',serif;font-size:22px;">Connect your database to continue</h2>
    <p style="color:var(--ink-soft);line-height:1.65;font-size:14px;">
      This app stores its data in a Supabase project rather than in the browser. Open <code>config.js</code> in this
      folder, paste in your project's <b>Project URL</b> and <b>anon public key</b> (found under
      Supabase → Settings → API), save the file, and reload this page. Full steps are in <code>README.md</code>.
    </p>
  </div>`;
}

async function loadData(){
  if(!isConfigured()){ renderSetupScreen(); return; }
  setSaveStatus('busy','Connecting…');
  try{
    const [caseRes, insR, insdR, visR, staR, payR] = await Promise.all([
      supa.from('case_table').select('*').order('created_at', {ascending:false}),
      supa.from('insurance_details').select('*'),
      supa.from('insured_details').select('*'),
      supa.from('visit_details').select('*'),
      supa.from('status_details').select('*'),
      supa.from('payment_details').select('*'),
    ]);
    const firstError = [caseRes, insR, insdR, visR, staR, payR].map(r=>r.error).find(Boolean);
    if(firstError) throw firstError;
    cases = (caseRes.data||[]).map(r=>({
      caseID: r.case_id, companyName: r.company_name||'', dateOfAccident: r.date_of_accident||'', deputeDate: r.depute_date||'', createdAt: r.created_at,
      insurance: (insR.data||[]).filter(x=>x.case_id===r.case_id).map(x=>dbToJsRow('insurance',x)),
      insured:   (insdR.data||[]).filter(x=>x.case_id===r.case_id).map(x=>dbToJsRow('insured',x)),
      visits:    (visR.data||[]).filter(x=>x.case_id===r.case_id).map(x=>dbToJsRow('visits',x)),
      statuses:  (staR.data||[]).filter(x=>x.case_id===r.case_id).map(x=>dbToJsRow('statuses',x)),
      payments:  (payR.data||[]).filter(x=>x.case_id===r.case_id).map(x=>dbToJsRow('payments',x)),
    }));
    setSaveStatus('ok', cases.length ? 'Connected · all changes saved' : 'Connected · no cases yet');
  }catch(e){
    cases = [];
    setSaveStatus('err','Could not connect to the database');
    toast('Connection error: ' + (e.message||e));
  }
  if(cases.length && !selectedId) selectedId = cases[0].caseID;
  renderAll();
}

/* ================= Case-level actions ================= */

function nextCaseId(){
  const nums = cases.map(c=>parseInt(c.caseID,10)).filter(n=>!isNaN(n));
  return String((nums.length?Math.max(...nums):1100)+1);
}

async function newCase(){
  const newId = nextCaseId();
  setSaveStatus('busy','Creating case…');
  const {data, error} = await supa.from('case_table')
    .insert({case_id:newId, company_name:'New Company', date_of_accident:null, depute_date:null})
    .select().single();
  if(error){ setSaveStatus('err','Not saved — retry'); toast('Could not create case: '+error.message); return; }
  cases.unshift({
    caseID: data.case_id, companyName: data.company_name||'', dateOfAccident: data.date_of_accident||'',
    deputeDate: data.depute_date||'', createdAt: data.created_at,
    insurance: [], insured: [], visits: [], statuses: [], payments: []
  });
  selectedId = newId;
  resetEditState();
  setSaveStatus('ok','Saved · '+nowStamp());
  renderAll();
}

async function deleteCase(id){
  if(!confirm('Delete case '+id+' and all its records? This cannot be undone.')) return;
  setSaveStatus('busy','Deleting…');
  const {error} = await supa.from('case_table').delete().eq('case_id', id);
  if(error){ setSaveStatus('err','Not saved — retry'); toast('Could not delete case: '+error.message); return; }
  cases = cases.filter(c=>c.caseID!==id);
  selectedId = cases.length?cases[0].caseID:null;
  resetEditState();
  setSaveStatus('ok','Saved · '+nowStamp());
  renderAll();
}

function getCase(id){ return cases.find(c=>c.caseID===id); }

function latestStatus(c){
  if(!c.statuses.length) return null;
  return [...c.statuses].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(-1)[0];
}
function statusClass(statusText){
  if(!statusText) return 'none';
  const s = statusText.toLowerCase();
  if(s.includes('submit')||s.includes('closed')||s.includes('final')) return 'submitted';
  if(s.includes('process')||s.includes('pending')||s.includes('query')) return 'process';
  return 'none';
}

/* ================= Header edit / save / cancel ================= */

function startEditHeader(c){
  headerEditing = true;
  headerDraft = {companyName:c.companyName, caseID:c.caseID, dateOfAccident:c.dateOfAccident, deputeDate:c.deputeDate};
  renderMain();
}
function cancelEditHeader(){
  headerEditing = false; headerDraft = null;
  renderMain();
}
async function saveHeader(c){
  const newCompany = document.getElementById('fCompany').value.trim() || 'Untitled';
  const newCaseId = document.getElementById('fCaseId').value.trim();
  const newAccident = document.getElementById('fAccident').value;
  const newDepute = document.getElementById('fDepute').value;

  if(!newCaseId){ toast('Case ID cannot be empty'); return; }
  if(newCaseId !== c.caseID && getCase(newCaseId)){ toast('Case ID must be unique'); return; }

  setSaveStatus('busy','Saving…');
  try{
    if(newCaseId !== c.caseID){
      const {error: renameErr} = await supa.from('case_table').update({case_id:newCaseId}).eq('case_id', c.caseID);
      if(renameErr) throw renameErr;
    }
    const {error} = await supa.from('case_table').update({
      company_name: newCompany, date_of_accident: newAccident || null, depute_date: newDepute || null
    }).eq('case_id', newCaseId);
    if(error) throw error;

    c.caseID = newCaseId; c.companyName = newCompany; c.dateOfAccident = newAccident; c.deputeDate = newDepute;
    selectedId = newCaseId;
    headerEditing = false; headerDraft = null;
    setSaveStatus('ok','Saved · '+nowStamp());
    renderAll();
  }catch(e){
    setSaveStatus('err','Not saved — retry');
    toast('Could not save: '+(e.message||e));
  }
}

/* ================= Row edit / save / cancel ================= */

function startEditRow(tKey, c, rowId){
  const row = c[tKey].find(r=>r.id===rowId);
  if(row) rowDrafts[rowId] = {...row};
  editingRows.add(rowId);
  renderMain();
}

function cancelEditRow(tKey, c, rowId){
  if(pendingNewRows.has(rowId)){
    c[tKey] = c[tKey].filter(r=>r.id!==rowId);
    pendingNewRows.delete(rowId);
  } else if(rowDrafts[rowId]){
    const row = c[tKey].find(r=>r.id===rowId);
    if(row) Object.assign(row, rowDrafts[rowId]);
  }
  editingRows.delete(rowId);
  delete rowDrafts[rowId];
  renderMain();
}

function readRowInputs(tKey, rowId){
  const tr = document.querySelector(`tr[data-id="${rowId}"]`);
  const values = {};
  tr.querySelectorAll('[data-f]').forEach(inp=>{ values[inp.dataset.f] = inp.value; });
  return values;
}

function toDbPayload(tKey, values, caseID){
  const cfg = TABLE_CONFIG[tKey];
  const payload = caseID ? {case_id: caseID} : {};
  Object.entries(cfg.cols).forEach(([jsKey, dbCol])=>{
    let v = values[jsKey];
    if(dbCol.endsWith('date')) v = v || null;
    else if(dbCol === 'incurred_fee') v = (v===''||v==null) ? null : Number(v);
    else v = v ?? '';
    payload[dbCol] = v;
  });
  return payload;
}

async function saveRow(tKey, c, rowId){
  const values = readRowInputs(tKey, rowId);
  setSaveStatus('busy','Saving…');
  try{
    if(pendingNewRows.has(rowId)){
      const payload = toDbPayload(tKey, values, c.caseID);
      const {data, error} = await supa.from(TABLE_CONFIG[tKey].db).insert(payload).select().single();
      if(error) throw error;
      const idx = c[tKey].findIndex(r=>r.id===rowId);
      c[tKey][idx] = dbToJsRow(tKey, data);
      pendingNewRows.delete(rowId);
    } else {
      const payload = toDbPayload(tKey, values, null);
      const {error} = await supa.from(TABLE_CONFIG[tKey].db).update(payload).eq('id', rowId);
      if(error) throw error;
      const row = c[tKey].find(r=>r.id===rowId);
      Object.assign(row, values);
    }
    editingRows.delete(rowId);
    delete rowDrafts[rowId];
    setSaveStatus('ok','Saved · '+nowStamp());
    if(tKey==='statuses') renderSidebar();
    renderMain();
  }catch(e){
    setSaveStatus('err','Not saved — retry');
    toast('Could not save row: '+(e.message||e));
  }
}

async function deleteRow(tKey, c, rowId){
  if(pendingNewRows.has(rowId)){
    c[tKey] = c[tKey].filter(r=>r.id!==rowId);
    pendingNewRows.delete(rowId); editingRows.delete(rowId); delete rowDrafts[rowId];
    renderMain(); return;
  }
  setSaveStatus('busy','Deleting…');
  const {error} = await supa.from(TABLE_CONFIG[tKey].db).delete().eq('id', rowId);
  if(error){ setSaveStatus('err','Not saved — retry'); toast('Could not delete row: '+error.message); return; }
  c[tKey] = c[tKey].filter(r=>r.id!==rowId);
  setSaveStatus('ok','Saved · '+nowStamp());
  renderMain(); renderSidebar();
}

function addDraftRow(tKey, c){
  const tempId = 'new-'+uid();
  c[tKey].push({id: tempId, ...blankRow(tKey)});
  pendingNewRows.add(tempId);
  editingRows.add(tempId);
  collapsed[tKey] = false;
  renderMain();
}

/* ================= Backup / restore ================= */

function exportBackup(){
  if(!cases.length){ toast('Nothing to back up yet'); return; }
  const blob = new Blob([JSON.stringify(cases, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'case-register-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup file downloaded');
}

async function importBackup(file){
  const reader = new FileReader();
  reader.onload = async () => {
    let incoming;
    try{ incoming = JSON.parse(reader.result); }
    catch(e){ toast('That file is not valid JSON'); return; }
    if(!Array.isArray(incoming)){ toast('Backup file format not recognized'); return; }
    setSaveStatus('busy','Restoring…');
    let added = 0, skipped = 0;
    for(const c of incoming){
      if(!c || !c.caseID || getCase(String(c.caseID))){ skipped++; continue; }
      const {error: caseErr} = await supa.from('case_table').insert({
        case_id: String(c.caseID), company_name: c.companyName||'',
        date_of_accident: c.dateOfAccident||null, depute_date: c.deputeDate||null
      });
      if(caseErr){ skipped++; continue; }
      for(const tKey of ['insurance','insured','visits','statuses','payments']){
        const rows = Array.isArray(c[tKey]) ? c[tKey] : [];
        for(const r of rows){
          await supa.from(TABLE_CONFIG[tKey].db).insert(toDbPayload(tKey, r, String(c.caseID)));
        }
      }
      added++;
    }
    await loadData();
    toast(`Restored ${added} case${added===1?'':'s'}${skipped?`, skipped ${skipped} duplicate${skipped===1?'':'s'}`:''}`);
  };
  reader.readAsText(file);
}

/* ================= Rendering ================= */

function renderAll(){
  document.getElementById('totalCases').textContent = cases.length;
  renderSidebar();
  renderMain();
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderSidebar(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = document.getElementById('caseList');
  const filtered = cases.filter(c =>
    !q || c.caseID.toLowerCase().includes(q) || (c.companyName||'').toLowerCase().includes(q)
  );
  if(!filtered.length){
    list.innerHTML = `<div class="empty-side">${cases.length? 'No cases match your search.' : 'No cases yet. Click “+ New Case” to open your first file.'}</div>`;
    return;
  }
  list.innerHTML = filtered.map(c=>{
    const ls = latestStatus(c);
    const sc = ls ? statusClass(ls.status) : 'none';
    const bg = sc==='submitted' ? 'var(--ledger-green-soft)' : sc==='process' ? 'var(--amber-soft)' : 'var(--line-soft)';
    const fg = sc==='submitted' ? 'var(--ledger-green)' : sc==='process' ? 'var(--amber)' : 'var(--ink-soft)';
    const label = ls ? ls.status : 'No status';
    return `<div class="case-tab ${c.caseID===selectedId?'active':''}" data-id="${c.caseID}">
      <div class="ct-id">CASE #${escapeHtml(c.caseID)}</div>
      <div class="ct-company">${escapeHtml(c.companyName||'Untitled')}</div>
      <div class="ct-meta">
        <span>${escapeHtml(c.dateOfAccident||'—')}</span>
        <span class="status-chip" style="background:${bg};color:${fg}">${escapeHtml(label)}</span>
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('.case-tab').forEach(el=>{
    el.addEventListener('click',()=>{
      if(el.dataset.id === selectedId) return;
      selectedId = el.dataset.id;
      resetEditState();
      renderAll();
    });
  });
}

function renderMain(){
  const main = document.getElementById('main');
  const c = getCase(selectedId);
  if(!c){
    main.innerHTML = `<div class="no-case">
      <h2>No case selected</h2>
      <p>Choose a case from the register on the left, or start a new file to begin logging insurance, insured party, visit, status and payment details. Fill in a field, then press its Save button to store it.</p>
    </div>`;
    return;
  }
  const ls = latestStatus(c);
  const sc = ls ? statusClass(ls.status) : 'none';

  main.innerHTML = `
    <div class="case-header">
      ${headerEditing ? headerEditBlock(c) : headerDisplayBlock(c)}
      <div class="ch-actions">
        <span class="stamp ${sc}">${ls ? escapeHtml(ls.status) : 'No status'}</span>
        ${headerEditing
          ? `<button class="icon-btn primary" id="saveHeaderBtn">Save</button><button class="icon-btn" id="cancelHeaderBtn">Cancel</button>`
          : `<button class="icon-btn" id="editHeaderBtn">Edit case</button>`}
        <button class="icon-btn" id="deleteCaseBtn">Delete case</button>
      </div>
    </div>

    ${section('insurance','Insurance Details','1', insuranceTable(c))}
    ${section('insured','Insured Details','2', insuredTable(c))}
    ${section('visits','Visit Details','3', visitTable(c))}
    ${section('statuses','Status Details','4', statusTable(c))}
    ${paymentSection(c)}

    document.getElementById('saveHeaderBtn').addEventListener('click', ()=>saveHeader(c));

function headerEditBlock(c){

function section(key, title, num, bodyHtml){
  return `<div class="section ${collapsed[key]?'collapsed':''}" data-section="${key}">
    <button class="section-head" data-toggle="${key}" aria-expanded="${!collapsed[key]}">
      <span class="section-title"><span class="num">${num}</span>${title}</span>
      <span class="chevron">▾</span>
    </button>
    <div class="section-body">${bodyHtml}</div>
  </div>`;
}

function bindAccordionHandlers(){
  document.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.toggle;
      collapsed[key] = !collapsed[key];
      const sectionEl = btn.closest('.section');
      sectionEl.classList.toggle('collapsed', collapsed[key]);
      btn.setAttribute('aria-expanded', String(!collapsed[key]));
    });
  });
  // live BS hint updates while editing the case header
  const accInput = document.getElementById('fAccident');
  if(accInput) accInput.addEventListener('input', ()=>{
    const el = document.getElementById('bsAccident');
    if(el) el.innerHTML = bsLabel(accInput.value) ? '<b>'+bsLabel(accInput.value)+'</b>' : '';
  });
  const depInput = document.getElementById('fDepute');
  if(depInput) depInput.addEventListener('input', ()=>{
    const el = document.getElementById('bsDepute');
    if(el) el.innerHTML = bsLabel(depInput.value) ? '<b>'+bsLabel(depInput.value)+'</b>' : '';
  });
}

/* ---------- Generic row rendering ---------- */

function renderCell(f, row){
  if(f.type==='select'){
    return `<td class="input-cell"><select class="cell-select" data-f="${f.key}">
      <option value="">Select…</option>
      ${f.options.map(o=>`<option value="${o}" ${row[f.key]===o?'selected':''}>${o}</option>`).join('')}
    </select></td>`;
  }
  if(f.type==='date'){
    return `<td class="input-cell"><input class="cell-input" type="date" data-f="${f.key}" value="${escapeHtml(row[f.key])}">${f.bs?`<div class="cell-bs" data-bshint="${row.id}">${escapeHtml(bsLabel(row[f.key]))}</div>`:''}</td>`;
  }
  if(f.type==='number'){
    return `<td class="input-cell"><input class="cell-input" type="number" step="0.01" data-f="${f.key}" value="${escapeHtml(row[f.key])}" placeholder="0.00"></td>`;
  }
  return `<td class="input-cell"><input class="cell-input" data-f="${f.key}" value="${escapeHtml(row[f.key])}" placeholder="${escapeHtml(f.placeholder||'')}"></td>`;
}

function displayCell(f, row){
  const raw = row[f.key];
  if(raw===''||raw==null){
    return `<td class="display-cell muted">—</td>`;
  }
  if(f.type==='date'){
    const bs = bsLabel(raw);
    return `<td class="display-cell">${escapeHtml(raw)}${bs?` <span class="cell-bs-inline">${escapeHtml(bs)}</span>`:''}</td>`;
  }
  if(f.type==='number'){
    const n = Number(raw);
    return `<td class="display-cell">${isNaN(n) ? escapeHtml(raw) : 'Rs. '+n.toFixed(2)}</td>`;
  }
  return `<td class="display-cell">${escapeHtml(raw)}</td>`;
}

function renderRow(tKey, row){
  const fields = FIELD_DEFS[tKey];
  const isEditing = editingRows.has(row.id);
  const cells = fields.map(f => isEditing ? renderCell(f, row) : displayCell(f, row)).join('');
  const actions = isEditing
    ? `<td class="col-actions"><button class="mini-btn save" data-saverow="${row.id}">Save</button><button class="mini-btn" data-cancelrow="${row.id}">Cancel</button></td>`
    : `<td class="col-actions"><button class="mini-btn" data-editrow="${row.id}">Edit</button><button class="del-btn" data-del="${row.id}" title="Delete row">×</button></td>`;
  return `<tr data-id="${row.id}" class="${isEditing?'editing-row':''}">${cells}${actions}</tr>`;
}

function gridWrap(tKey, headers, rows){
  const countLabel = `${rows.length} ${rows.length===1?'entry':'entries'}`;
  return `<div style="display:flex;justify-content:flex-end;margin-bottom:6px;"><span class="count-badge">${countLabel}</span></div>
  <table class="grid" data-table="${tKey}">
    <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}<th style="width:118px"></th></tr></thead>
    <tbody>
      ${rows.length ? rows.map(r=>renderRow(tKey, r)).join('') : `<tr><td class="empty-grid" colspan="${headers.length+1}">No entries yet.</td></tr>`}
    </tbody>
  </table>
  <button class="add-row-btn" data-add="${tKey}">+ Add row</button>`;
}

function insuranceTable(c){ return gridWrap('insurance', ['Insurer','Insurance Type','Claim Date','Policy No','Claim No'], c.insurance); }
function insuredTable(c){ return gridWrap('insured', ['Insured Bank Name','Insured Person Name'], c.insured); }
function visitTable(c){ return gridWrap('visits', ['Visit No','Visit Date','Visited By'], c.visits); }
function statusTable(c){ return gridWrap('statuses', ['Status','Date','Remarks'], c.statuses); }
function paymentSection(c){
  const body = gridWrap('payments', ['Incurred Fee (Rs.)','Payment Status','Date','Remarks'], c.payments);
  return `<div class="section payment-box ${collapsed.payments?'collapsed':''}" data-section="payments">
    <button class="section-head" data-toggle="payments" aria-expanded="${!collapsed.payments}">
      <span class="section-title"><span class="num">5</span>Payment Details</span>
      <span class="chevron">▾</span>
    </button>
    <div class="section-body">${body}</div>
  </div>`;
}

/* ---------- Grid event binding ---------- */

function bindGridHandlers(c){
  document.querySelectorAll('table.grid').forEach(table=>{
    const tKey = table.dataset.table;

    // live BS hint while editing a date cell
    table.querySelectorAll('input[type="date"][data-f]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const tr = inp.closest('tr');
        const hint = tr.querySelector(`[data-bshint="${tr.dataset.id}"]`);
        if(hint) hint.textContent = bsLabel(inp.value);
      });
    });

    table.querySelectorAll('button[data-editrow]').forEach(btn=>{
      btn.addEventListener('click', ()=>startEditRow(tKey, c, btn.dataset.editrow));
    });
    table.querySelectorAll('button[data-saverow]').forEach(btn=>{
      btn.addEventListener('click', ()=>saveRow(tKey, c, btn.dataset.saverow));
    });
    table.querySelectorAll('button[data-cancelrow]').forEach(btn=>{
      btn.addEventListener('click', ()=>cancelEditRow(tKey, c, btn.dataset.cancelrow));
    });
    table.querySelectorAll('button[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>deleteRow(tKey, c, btn.dataset.del));
    });
  });
  document.querySelectorAll('button[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>addDraftRow(btn.dataset.add, c));
  });
}

/* ---------- Init ---------- */

document.getElementById('newCaseBtn').addEventListener('click', newCase);
document.getElementById('search').addEventListener('input', renderSidebar);
document.getElementById('exportBtn').addEventListener('click', exportBackup);
document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importInput').click());
document.getElementById('importInput').addEventListener('change', (e)=>{
  if(e.target.files[0]) importBackup(e.target.files[0]);
  e.target.value = '';
});

loadData();
</script>
