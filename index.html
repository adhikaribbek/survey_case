<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A simple case register for insurance surveyors — track case, visit, status and payment details, stored in a shared database.">
<title>Case Register — Insurance Surveyor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231F2430'/%3E%3Ctext x='50' y='67' font-size='54' font-family='Georgia,serif' fill='white' text-anchor='middle'%3E%C2%A7%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --bg:#FAFAF8;
    --card:#FFFFFF;
    --border:#E7E5DE;
    --border-soft:#F0EEE8;
    --text:#1E2430;
    --text-muted:#7A8090;
    --text-faint:#A7ACB8;
    --accent:#1E2430;
    --accent-hover:#333B4D;
    --danger:#C0392B;
    --success:#2F8F5B;
    --success-bg:#E7F3EC;
    --warning:#C08A2E;
    --warning-bg:#FBF1DF;
    --neutral-bg:#F0EFEA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;height:100%;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  #app{display:flex;min-height:100vh;}
  button{font-family:inherit;}
  code{background:var(--neutral-bg);padding:1px 5px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:.9em;}

  /* ---------- Sidebar ---------- */
  #sidebar{width:280px;flex:0 0 280px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:100vh;}
  .sidebar-head{padding:24px 20px 18px;}
  .brand-title{font-size:17px;font-weight:700;letter-spacing:-.01em;}
  .brand-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .total-row{margin-top:16px;display:flex;align-items:baseline;gap:6px;}
  .total-num{font-size:22px;font-weight:700;}
  .total-label{font-size:12px;color:var(--text-muted);}

  .sidebar-controls{padding:0 16px 14px;}
  #search{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;background:var(--bg);font-size:13.5px;color:var(--text);}
  #search:focus{outline:none;border-color:var(--accent);}
  #newCaseBtn{width:100%;margin-top:9px;padding:10px 12px;border:none;border-radius:7px;background:var(--accent);color:#fff;font-weight:600;font-size:13.5px;cursor:pointer;}
  #newCaseBtn:hover{background:var(--accent-hover);}
  #newCaseBtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  #caseList{flex:1;overflow-y:auto;padding:4px 10px;}
  .case-tab{padding:10px 12px;border-radius:7px;cursor:pointer;margin-bottom:2px;}
  .case-tab:hover{background:var(--neutral-bg);}
  .case-tab.active{background:var(--text);}
  .case-tab.active .ct-company{color:#fff;}
  .case-tab.active .ct-id, .case-tab.active .ct-date{color:#B7BBC4;}
  .ct-company{font-size:14px;font-weight:600;}
  .ct-id{font-size:11px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;}
  .ct-meta{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
  .ct-date{font-size:11.5px;color:var(--text-muted);}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;flex:0 0 7px;}
  .dot.success{background:var(--success);}
  .dot.warning{background:var(--warning);}
  .dot.neutral{background:var(--text-faint);}
  .status-label{font-size:11px;color:var(--text-muted);display:inline-flex;align-items:center;}
  .empty-side{padding:20px 14px;color:var(--text-muted);font-size:13px;line-height:1.6;}

  .sidebar-foot{border-top:1px solid var(--border);padding:14px 16px;display:flex;flex-direction:column;gap:9px;}
  #saveStatusRow{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-muted);}
  .save-dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex:0 0 7px;}
  .save-dot.busy{background:var(--warning);}
  .save-dot.err{background:var(--danger);}
  .storage-note{font-size:11px;color:var(--text-faint);line-height:1.5;}
  .backup-row{display:flex;gap:8px;}
  .ghost-btn{flex:1;border:1px solid var(--border);background:var(--card);border-radius:6px;padding:7px 8px;font-size:11.5px;cursor:pointer;color:var(--text-muted);font-weight:500;}
  .ghost-btn:hover{border-color:var(--text-muted);color:var(--text);}
  .ghost-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---------- Main ---------- */
  #main{flex:1;padding:36px 44px 60px;min-width:0;max-width:920px;}
  .no-case{max-width:420px;margin:100px auto;text-align:center;color:var(--text-muted);}
  .no-case h2{color:var(--text);font-size:19px;font-weight:700;margin-bottom:8px;}
  .no-case p{font-size:14px;line-height:1.7;}

  /* Case details card (company/case id/dates/insurance/insured — all one card now) */
  .case-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:26px 28px;margin-bottom:22px;}
  .cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
  .cc-title-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .cc-title{font-size:20px;font-weight:700;letter-spacing:-.01em;}
  .cc-id-tag{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-muted);background:var(--neutral-bg);padding:3px 9px;border-radius:5px;}
  .cc-status{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;}
  .cc-status.success{color:var(--success);background:var(--success-bg);}
  .cc-status.warning{color:var(--warning);background:var(--warning-bg);}
  .cc-status.neutral{color:var(--text-muted);background:var(--neutral-bg);}
  .cc-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .btn{border:1px solid var(--border);background:var(--card);border-radius:7px;padding:8px 14px;font-size:12.5px;cursor:pointer;color:var(--text-muted);font-weight:500;}
  .btn:hover{border-color:var(--text-muted);color:var(--text);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.primary:hover{background:var(--accent-hover);}
  .btn.text-danger{border:none;background:none;color:var(--text-faint);padding:8px 4px;}
  .btn.text-danger:hover{color:var(--danger);}

  .field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px 24px;}
  .field-grid.section-gap{margin-top:22px;padding-top:22px;border-top:1px solid var(--border-soft);}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:5px;}
  .field-value{font-size:14px;color:var(--text);}
  .field-value.muted{color:var(--text-faint);}
  .field-bs{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
  .field-input{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13.5px;color:var(--text);background:var(--bg);}
  .field-input:focus{outline:none;border-color:var(--accent);background:var(--card);}
  .field-hint{font-size:11px;color:var(--text-muted);margin-top:4px;min-height:14px;}
  .subhead{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}

  /* accordion sections (Visit / Status / Payment) */
  .section{margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .section-head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:none;border:none;cursor:pointer;text-align:left;}
  .section-head:hover{background:var(--bg);}
  .section-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .section-title{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:9px;}
  .count-badge{font-size:12px;color:var(--text-faint);font-weight:500;}
  .chevron{transition:transform .16s ease;color:var(--text-faint);font-size:12px;}
  .section.collapsed .chevron{transform:rotate(-90deg);}
  .section-body{padding:0 20px 18px;}
  .section.collapsed .section-body{display:none;}

  .add-row-btn{border:1px dashed var(--border);background:transparent;color:var(--text-muted);font-size:12.5px;padding:7px 12px;border-radius:6px;cursor:pointer;margin-top:10px;}
  .add-row-btn:hover{border-color:var(--text-muted);color:var(--text);}
  .add-row-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  table.grid{width:100%;border-collapse:collapse;}
  table.grid thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);padding:0 10px 8px;font-weight:600;}
  table.grid tbody td{padding:10px;border-top:1px solid var(--border-soft);vertical-align:top;}
  table.grid td.input-cell{padding:6px 4px;}
  table.grid tbody tr.editing-row{background:#FBFAF6;}
  .cell-input, .cell-select{width:100%;border:1px solid var(--border);border-radius:6px;background:var(--bg);padding:7px 9px;font-size:13.5px;color:var(--text);}
  .cell-input:focus, .cell-select:focus{outline:none;border-color:var(--accent);background:var(--card);}
  .cell-bs{font-size:10.5px;color:var(--text-muted);padding:3px 2px 0;}
  .cell-bs-inline{font-size:11px;color:var(--text-muted);}
  .display-cell{font-size:13.5px;color:var(--text);}
  .display-cell.muted{color:var(--text-faint);}
  td.col-actions{width:112px;white-space:nowrap;text-align:right;}
  .mini-btn{border:1px solid var(--border);background:var(--card);border-radius:5px;padding:5px 10px;font-size:11.5px;cursor:pointer;color:var(--text-muted);font-weight:500;margin-left:5px;}
  .mini-btn:hover{border-color:var(--text-muted);color:var(--text);}
  .mini-btn.save{background:var(--accent);color:#fff;border-color:var(--accent);}
  .mini-btn.save:hover{background:var(--accent-hover);}
  .mini-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .del-btn{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:16px;padding:5px 6px;line-height:1;margin-left:2px;}
  .del-btn:hover{color:var(--danger);}
  .empty-grid{padding:14px 10px;font-size:13px;color:var(--text-faint);font-style:italic;}

  select.cell-select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%237A8090'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:26px;}

  .toast{position:fixed;bottom:20px;right:26px;background:var(--text);color:#fff;padding:10px 16px;border-radius:8px;font-size:12.5px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:50;max-width:320px;}
  .toast.show{opacity:1;transform:translateY(0);}

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}
  #importInput{display:none;}

  @media (max-width:820px){
    #app{flex-direction:column;}
    #sidebar{width:100%;flex:none;min-height:auto;max-height:360px;}
    #main{padding:24px 18px 60px;}
    .case-card{padding:20px;}
    td.col-actions{width:auto;}
  }
</style>
</head>

</div>

[31,32,31,32,31,30,30,30,29,29,30,31],2047:[31,31,31,32,31,31,30,29,30,29,30,30],2048:[31,31,32,31,31,31,30,29,30,29,30,30],2049:[31,32,31,32,31,30,30,30,29,29,30,30],2050:[31,32,31,32,31,30,30,30,29,30,29,31],2051:[31,31,31,32,31,31,30,29,30,29,30,30],2052:[31,31,32,31,31,31,30,29,30,29,30,30],2053:[31,32,31,32,31,30,30,30,29,29,30,30],2054:[31,32,31,32,31,30,30,30,29,30,29,31],2055:[31,31,32,31,31,31,30,29,30,29,30,30],2056:[31,31,32,31,32,30,30,29,30,29,30,30],2057:[31,32,31,32,31,30,30,30,29,29,30,31],2058:[30,32,31,32,31,30,30,30,29,30,29,31],2059:[31,31,32,31,31,31,30,29,30,29,30,30],2060:[31,31,32,32,31,30,30,29,30,29,30,30],2061:[31,32,31,32,31,30,30,30,29,29,30,31],2062:[30,32,31,32,31,31,29,30,29,30,29,31],2063:[31,31,32,31,31,31,30,29,30,29,30,30],2064:[31,31,32,32,31,30,30,29,30,29,30,30],2065:[31,32,31,32,31,30,30,30,29,29,30,31],2066:[31,31,31,32,31,31,29,30,30,29,29,31],2067:[31,31,32,31,31,31,30,29,30,29,30,30],2068:[31,31,32,32,31,30,30,29,30,29,30,30],2069:[31,32,31,32,31,30,30,30,29,29,30,31],2070:[31,31,31,32,31,31,29,30,30,29,30,30],2071:[31,31,32,31,31,31,30,29,30,29,30,30],2072:[31,32,31,32,31,30,30,29,30,29,30,30],2073:[31,32,31,32,31,30,30,30,29,29,30,31],2074:[31,31,31,32,31,31,30,29,30,29,30,30],2075:[31,31,32,31,31,31,30,29,30,29,30,30],2076:[31,32,31,32,31,30,30,30,29,29,30,30],2077:[31,32,31,32,31,30,30,30,29,30,29,31],2078:[31,31,31,32,31,31,30,29,30,29,30,30],2079:[31,31,32,31,31,31,30,29,30,29,30,30],2080:[31,32,31,32,31,30,30,30,29,29,30,30],2081:[31,32,31,32,31,30,30,30,29,30,29,31],2082:[31,31,32,31,31,31,30,29,30,29,30,30],2083:[31,31,32,31,31,31,30,29,30,29,30,30],2084:[31,32,31,32,31,30,30,30,29,29,30,31],2085:[30,32,31,32,31,30,30,30,29,30,29,31],2086:[31,31,32,31,31,31,30,29,30,29,30,30],2087:[31,31,32,31,31,31,30,30,29,30,30,30],2088:[30,31,32,32,30,31,30,30,29,30,30,30],2089:[30,32,31,32,31,30,30,30,29,30,30,30],2090:[30,32,31,32,31,30,30,30,29,30,30,30]};
const BS_MONTHS = ['Baisakh','Jestha','Asar','Shrawan','Bhadra','Aswin','Kartik','Mangsir','Poush','Magh','Falgun','Chaitra'];
const BS_EPOCH_AD = new Date('1943-04-14T00:00:00');

function adToBs(adStr){
  if(!adStr) return null;
  const target = new Date(adStr+'T00:00:00');
  if(isNaN(target)) return null;
  let days = Math.round((target - BS_EPOCH_AD)/86400000);
  if(days < 0) return null;
  let year = 2000, month = 0;
  while(true){
    if(month === 12){ month = 0; year++; }
    const yearData = BS_DATA[year];
    if(!yearData) return null;
    const mlen = yearData[month];
    if(days < mlen) break;
    days -= mlen; month++;
  }
  return {year, month: month+1, day: days+1};
}
function bsLabel(adStr){
  const r = adToBs(adStr);
  if(!r) return adStr ? 'B.S. date unavailable for this year' : '';
  return `B.S. ${r.day} ${BS_MONTHS[r.month-1]} ${r.year}`;
}

  visits:    {db:'visit_details',   cols:{visitNo:'visit_no', visitDate:'visit_date', visitedBy:'visited_by'}},
  statuses:  {db:'status_details',  cols:{status:'status', date:'date', remarks:'remarks'}},
  payments:  {db:'payment_details', cols:{incurredFee:'incurred_fee', payment:'payment', date:'date', remarks:'remarks'}},
};

const STATUS_OPTIONS = ['PSR On Process','PSR Submitted','Report Finalized','Query Raised','Closed'];
const PAYMENT_OPTIONS = ['Pending','Received','Partially Received'];

const FIELD_DEFS = {
  visits: [
    {key:'visitNo', label:'Visit No', type:'text'},
    {key:'visitDate', label:'Visit Date', type:'date', bs:true},
    {key:'visitedBy', label:'Visited By', type:'text', placeholder:'Surveyor name'},
  ],
  statuses: [
    {key:'status', label:'Status', type:'select', options:STATUS_OPTIONS},
    {key:'date', label:'Date', type:'date', bs:true},
    {key:'remarks', label:'Remarks', type:'text', placeholder:'Notes…'},
  ],
  payments: [
    {key:'incurredFee', label:'Incurred Fee (Rs.)', type:'number'},
    {key:'payment', label:'Payment Status', type:'select', options:PAYMENT_OPTIONS},
    {key:'date', label:'Date', type:'date', bs:true},
    {key:'remarks', label:'Remarks', type:'text', placeholder:'Notes…'},
  ],
};

// Case-level fields — one value per case, part of the single Case Details card.
const HEADER_FIELDS = [
  {key:'companyName', label:'Company / Client', type:'text', dbCol:'company_name', placeholder:'Company name'},
  {key:'dateOfAccident', label:'Date of Accident', type:'date', dbCol:'date_of_accident', bs:true},
  {key:'deputeDate', label:'Depute Date', type:'date', dbCol:'depute_date', bs:true},
];
const INSURANCE_FIELDS = [
  {key:'insurer', label:'Insurer', type:'text', dbCol:'insurer', placeholder:'e.g. Nepal Life'},
  {key:'insuranceType', label:'Insurance Type', type:'text', dbCol:'insurance_type', placeholder:'Third Party / Comprehensive'},
  {key:'claimDate', label:'Claim Date', type:'date', dbCol:'claim_date', bs:true},
  {key:'policyNo', label:'Policy No', type:'text', dbCol:'policy_no'},
  {key:'claimNo', label:'Claim No', type:'text', dbCol:'claim_no'},
];
const INSURED_FIELDS = [
  {key:'bankName', label:'Insured Bank Name', type:'text', dbCol:'insured_bank_name'},
  {key:'personName', label:'Insured Person Name', type:'text', dbCol:'insured_person_name', placeholder:'Full name'},
];
const ALL_HEADER_FIELDS = [...HEADER_FIELDS, ...INSURANCE_FIELDS, ...INSURED_FIELDS];

function dbToJsRow(tKey, row){
  const out = {id: row.id};
  for(const [jsKey, dbCol] of Object.entries(TABLE_CONFIG[tKey].cols)) out[jsKey] = row[dbCol] ?? '';
  return out;
}
function blankRow(tKey){
  const out = {};
  Object.keys(TABLE_CONFIG[tKey].cols).forEach(jsKey=>out[jsKey]='');
  return out;
}

function isConfigured(){ return !!supa; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function nowStamp(){ return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function setSaveStatus(mode, text){
  const dot = document.getElementById('saveDot');
  const label = document.getElementById('saveStatusText');
  if(!dot || !label) return;
  dot.className = 'save-dot' + (mode==='busy' ? ' busy' : mode==='err' ? ' err' : '');
  label.textContent = text;
}

function renderSetupScreen(){
  document.getElementById('app').innerHTML = `<div style="max-width:520px;margin:100px auto;padding:0 24px;text-align:center;">
    <h2 style="font-size:19px;font-weight:700;">Connect your database to continue</h2>
    <p style="color:var(--text-muted);line-height:1.7;font-size:14px;">
      Open <code>config.js</code> in this folder, paste in your Supabase project's <b>Project URL</b> and
      <b>anon public key</b> (Settings → API), save, and reload. Full steps are in <code>README.md</code>.
    </p>
  </div>`;
}

async function loadData(){
  if(!isConfigured()){ renderSetupScreen(); return; }
  setSaveStatus('busy','Connecting…');
  try{
    const [caseRes, visR, staR, payR] = await Promise.all([
      supa.from('case_table').select('*').order('created_at', {ascending:false}),
      supa.from('visit_details').select('*'),
      supa.from('status_details').select('*'),
      supa.from('payment_details').select('*'),
    ]);
    const firstError = [caseRes, visR, staR, payR].map(r=>r.error).find(Boolean);
    if(firstError) throw firstError;
    cases = (caseRes.data||[]).map(r=>({
      caseID: r.case_id,
      companyName: r.company_name||'', dateOfAccident: r.date_of_accident||'', deputeDate: r.depute_date||'',
      insurer: r.insurer||'', insuranceType: r.insurance_type||'', claimDate: r.claim_date||'',
      policyNo: r.policy_no||'', claimNo: r.claim_no||'',
      bankName: r.insured_bank_name||'', personName: r.insured_person_name||'',
      createdAt: r.created_at,
      visits:   (visR.data||[]).filter(x=>x.case_id===r.case_id).map(x=>dbToJsRow('visits',x)),
      statuses: (staR.data||[]).filter(x=>x.case_id===r.case_id).map(x=>dbToJsRow('statuses',x)),
      payments: (payR.data||[]).filter(x=>x.case_id===r.case_id).map(x=>dbToJsRow('payments',x)),
    }));
    setSaveStatus('ok', cases.length ? 'Connected · all changes saved' : 'Connected · no cases yet');
  }catch(e){
    cases = [];
    setSaveStatus('err','Could not connect to the database');
    toast('Connection error: ' + (e.message||e));
  }
  if(cases.length && !selectedId) selectedId = cases[0].caseID;
  renderAll();
}

/* ================= Case-level actions ================= */

function nextCaseId(){
  const nums = cases.map(c=>parseInt(c.caseID,10)).filter(n=>!isNaN(n));
  return String((nums.length?Math.max(...nums):1100)+1);
}

async function newCase(){
  const newId = nextCaseId();
  setSaveStatus('busy','Creating case…');
  const {data, error} = await supa.from('case_table')
    .insert({case_id:newId, company_name:'New Company'})
    .select().single();
  if(error){ setSaveStatus('err','Not saved — retry'); toast('Could not create case: '+error.message); return; }
  cases.unshift({
    caseID: data.case_id, companyName: data.company_name||'', dateOfAccident:'', deputeDate:'',
    insurer:'', insuranceType:'', claimDate:'', policyNo:'', claimNo:'', bankName:'', personName:'',
    createdAt: data.created_at, visits: [], statuses: [], payments: []
  });
  selectedId = newId;
  resetEditState();
  setSaveStatus('ok','Saved · '+nowStamp());
  renderAll();
}

async function deleteCase(id){
  if(!confirm('Delete case '+id+' and all its records? This cannot be undone.')) return;
  setSaveStatus('busy','Deleting…');
  const {error} = await supa.from('case_table').delete().eq('case_id', id);
  if(error){ setSaveStatus('err','Not saved — retry'); toast('Could not delete case: '+error.message); return; }
  cases = cases.filter(c=>c.caseID!==id);
  selectedId = cases.length?cases[0].caseID:null;
  resetEditState();
  setSaveStatus('ok','Saved · '+nowStamp());
  renderAll();
}

function getCase(id){ return cases.find(c=>c.caseID===id); }

function latestStatus(c){
  if(!c.statuses.length) return null;
  return [...c.statuses].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(-1)[0];
}
function statusClass(statusText){
  if(!statusText) return 'neutral';
  const s = statusText.toLowerCase();
  if(s.includes('submit')||s.includes('closed')||s.includes('final')) return 'success';
  if(s.includes('process')||s.includes('pending')||s.includes('query')) return 'warning';
  return 'neutral';
}

/* ================= Case Details card: edit / save / cancel ================= */

function startEditHeader(){ headerEditing = true; renderMain(); }
function cancelEditHeader(){ headerEditing = false; renderMain(); }

async function saveHeader(c){
  const newCaseId = document.getElementById('fCaseId').value.trim();
  if(!newCaseId){ toast('Case ID cannot be empty'); return; }
  if(newCaseId !== c.caseID && getCase(newCaseId)){ toast('Case ID must be unique'); return; }

  const values = {};
  ALL_HEADER_FIELDS.forEach(f=>{
    const el = document.getElementById('f_'+f.key);
    values[f.key] = el ? el.value : c[f.key];
  });

  setSaveStatus('busy','Saving…');
  try{
    if(newCaseId !== c.caseID){
      const {error: renameErr} = await supa.from('case_table').update({case_id:newCaseId}).eq('case_id', c.caseID);
      if(renameErr) throw renameErr;
    }
    const payload = {};
    ALL_HEADER_FIELDS.forEach(f=>{
      let v = values[f.key];
      payload[f.dbCol] = f.type==='date' ? (v || null) : (v ?? '');
    });
    const {error} = await supa.from('case_table').update(payload).eq('case_id', newCaseId);
    if(error) throw error;

    ALL_HEADER_FIELDS.forEach(f=>{ c[f.key] = values[f.key]; });
    c.caseID = newCaseId; selectedId = newCaseId;
    c.companyName = values.companyName || 'Untitled';
    headerEditing = false;
    setSaveStatus('ok','Saved · '+nowStamp());
    renderAll();
  }catch(e){
    setSaveStatus('err','Not saved — retry');
    toast('Could not save: '+(e.message||e));
  }
}

/* ================= Row edit / save / cancel (Visits / Status / Payment) ================= */

function startEditRow(tKey, c, rowId){
  const row = c[tKey].find(r=>r.id===rowId);
  if(row) rowDrafts[rowId] = {...row};
  editingRows.add(rowId);
  renderMain();
}
function cancelEditRow(tKey, c, rowId){
  if(pendingNewRows.has(rowId)){
    c[tKey] = c[tKey].filter(r=>r.id!==rowId);
    pendingNewRows.delete(rowId);
  } else if(rowDrafts[rowId]){
    const row = c[tKey].find(r=>r.id===rowId);
    if(row) Object.assign(row, rowDrafts[rowId]);
  }
  editingRows.delete(rowId);
  delete rowDrafts[rowId];
  renderMain();
}
function readRowInputs(rowId){
  const tr = document.querySelector(`tr[data-id="${rowId}"]`);
  const values = {};
  tr.querySelectorAll('[data-f]').forEach(inp=>{ values[inp.dataset.f] = inp.value; });
  return values;
}
function toDbPayload(tKey, values, caseID){
  const cfg = TABLE_CONFIG[tKey];
  const payload = caseID ? {case_id: caseID} : {};
  Object.entries(cfg.cols).forEach(([jsKey, dbCol])=>{
    let v = values[jsKey];
    if(dbCol.endsWith('date')) v = v || null;
    else if(dbCol === 'incurred_fee') v = (v===''||v==null) ? null : Number(v);
    else v = v ?? '';
    payload[dbCol] = v;
  });
  return payload;
}
async function saveRow(tKey, c, rowId){
  const values = readRowInputs(rowId);
  setSaveStatus('busy','Saving…');
  try{
    if(pendingNewRows.has(rowId)){
      const payload = toDbPayload(tKey, values, c.caseID);
      const {data, error} = await supa.from(TABLE_CONFIG[tKey].db).insert(payload).select().single();
      if(error) throw error;
      const idx = c[tKey].findIndex(r=>r.id===rowId);
      c[tKey][idx] = dbToJsRow(tKey, data);
      pendingNewRows.delete(rowId);
    } else {
      const payload = toDbPayload(tKey, values, null);
      const {error} = await supa.from(TABLE_CONFIG[tKey].db).update(payload).eq('id', rowId);
      if(error) throw error;
      const row = c[tKey].find(r=>r.id===rowId);
      Object.assign(row, values);
    }
    editingRows.delete(rowId);
    delete rowDrafts[rowId];
    setSaveStatus('ok','Saved · '+nowStamp());
    if(tKey==='statuses') renderSidebar();
    renderMain();
  }catch(e){
    setSaveStatus('err','Not saved — retry');
    toast('Could not save row: '+(e.message||e));
  }
}
async function deleteRow(tKey, c, rowId){
  if(pendingNewRows.has(rowId)){
    c[tKey] = c[tKey].filter(r=>r.id!==rowId);
    pendingNewRows.delete(rowId); editingRows.delete(rowId); delete rowDrafts[rowId];
    renderMain(); return;
  }
  setSaveStatus('busy','Deleting…');
  const {error} = await supa.from(TABLE_CONFIG[tKey].db).delete().eq('id', rowId);
  if(error){ setSaveStatus('err','Not saved — retry'); toast('Could not delete row: '+error.message); return; }
  c[tKey] = c[tKey].filter(r=>r.id!==rowId);
  setSaveStatus('ok','Saved · '+nowStamp());
  renderMain(); renderSidebar();
}
function addDraftRow(tKey, c){
  const tempId = 'new-'+uid();
  c[tKey].push({id: tempId, ...blankRow(tKey)});
  pendingNewRows.add(tempId);
  editingRows.add(tempId);
  collapsed[tKey] = false;
  renderMain();
}

/* ================= Backup / restore ================= */

function exportBackup(){
  if(!cases.length){ toast('Nothing to back up yet'); return; }
  const blob = new Blob([JSON.stringify(cases, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'case-register-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup file downloaded');
}

async function importBackup(file){
  const reader = new FileReader();
  reader.onload = async () => {
    let incoming;
    try{ incoming = JSON.parse(reader.result); }
    catch(e){ toast('That file is not valid JSON'); return; }
    if(!Array.isArray(incoming)){ toast('Backup file format not recognized'); return; }
    setSaveStatus('busy','Restoring…');
    let added = 0, skipped = 0;
    for(const c of incoming){
      if(!c || !c.caseID || getCase(String(c.caseID))){ skipped++; continue; }
      // Support both the current flat format and the older format where
      // insurance/insured were arrays — take the first entry if present.
      const oldIns = Array.isArray(c.insurance) && c.insurance.length ? c.insurance[0] : {};
      const oldInsd = Array.isArray(c.insured) && c.insured.length ? c.insured[0] : {};
      const {error: caseErr} = await supa.from('case_table').insert({
        case_id: String(c.caseID),
        company_name: c.companyName || '',
        date_of_accident: c.dateOfAccident || null,
        depute_date: c.deputeDate || null,
        insurer: c.insurer || oldIns.insurer || '',
        insurance_type: c.insuranceType || oldIns.insuranceType || '',
        claim_date: c.claimDate || oldIns.claimDate || null,
        policy_no: c.policyNo || oldIns.policyNo || '',
        claim_no: c.claimNo || oldIns.claimNo || '',
        insured_bank_name: c.bankName || oldInsd.bankName || '',
        insured_person_name: c.personName || oldInsd.personName || ''
      });
      if(caseErr){ skipped++; continue; }
      for(const tKey of ['visits','statuses','payments']){
        const rows = Array.isArray(c[tKey]) ? c[tKey] : [];
        for(const r of rows){
          await supa.from(TABLE_CONFIG[tKey].db).insert(toDbPayload(tKey, r, String(c.caseID)));
        }
      }
      added++;
    }
    await loadData();
    toast(`Restored ${added} case${added===1?'':'s'}${skipped?`, skipped ${skipped} duplicate${skipped===1?'':'s'}`:''}`);
  };
  reader.readAsText(file);
}

/* ================= Rendering ================= */

function renderAll(){
  document.getElementById('totalCases').textContent = cases.length;
  renderSidebar();
  renderMain();
}
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderSidebar(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = document.getElementById('caseList');
  const filtered = cases.filter(c =>
    !q || c.caseID.toLowerCase().includes(q) || (c.companyName||'').toLowerCase().includes(q)
  );
  if(!filtered.length){
    list.innerHTML = `<div class="empty-side">${cases.length? 'No matches.' : 'No cases yet — start with “+ New Case.”'}</div>`;
    return;
  }
  list.innerHTML = filtered.map(c=>{
    const ls = latestStatus(c);
    const sc = ls ? statusClass(ls.status) : 'neutral';
    const label = ls ? ls.status : 'No status';
    return `<div class="case-tab ${c.caseID===selectedId?'active':''}" data-id="${c.caseID}">
      <div class="ct-company">${escapeHtml(c.companyName||'Untitled')}</div>
      <div class="ct-id">#${escapeHtml(c.caseID)}</div>
      <div class="ct-meta">
        <span class="ct-date">${escapeHtml(c.dateOfAccident||'—')}</span>
        <span class="status-label"><span class="dot ${sc}"></span>${escapeHtml(label)}</span>
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('.case-tab').forEach(el=>{
    el.addEventListener('click',()=>{
      if(el.dataset.id === selectedId) return;
      selectedId = el.dataset.id;
      resetEditState();
      renderAll();
    });
  });
}

function renderMain(){
  const main = document.getElementById('main');
  const c = getCase(selectedId);
  if(!c){
    main.innerHTML = `<div class="no-case">
      <h2>No case selected</h2>
      <p>Choose a case on the left, or start a new one. Every field has its own Edit and Save button — nothing saves until you press Save.</p>
    </div>`;
    return;
  }
  const ls = latestStatus(c);
  const sc = ls ? statusClass(ls.status) : 'neutral';

  main.innerHTML = `
    <div class="case-card">
      <div class="cc-top">
        <div class="cc-title-group">
          ${headerEditing
            ? `<input class="field-input" id="f_companyName" value="${escapeHtml(c.companyName)}" placeholder="Company / Client name" style="font-size:16px;font-weight:700;width:260px;">`
            : `<span class="cc-title">${escapeHtml(c.companyName||'Untitled')}</span>`}
          <span class="cc-id-tag">#${escapeHtml(c.caseID)}</span>
          <span class="cc-status ${sc}">${ls ? escapeHtml(ls.status) : 'No status'}</span>
        </div>
        <div class="cc-actions">
          ${headerEditing
            ? `<button class="btn primary" id="saveHeaderBtn">Save</button><button class="btn" id="cancelHeaderBtn">Cancel</button>`
            : `<button class="btn" id="editHeaderBtn">Edit</button>`}
        </div>
      </div>

      ${headerEditing ? headerFieldsEdit(c) : headerFieldsDisplay(c)}

      <div style="margin-top:20px;text-align:right;">
        <button class="btn text-danger" id="deleteCaseBtn">Delete this case</button>
      </div>
    </div>

    ${section('visits','Visit Details', visitTable(c))}
    ${section('statuses','Status Details', statusTable(c))}
    ${section('payments','Payment Details', paymentTable(c))}
  `;

  if(headerEditing){
    document.getElementById('saveHeaderBtn').addEventListener('click', ()=>saveHeader(c));
    document.getElementById('cancelHeaderBtn').addEventListener('click', cancelEditHeader);
    ALL_HEADER_FIELDS.filter(f=>f.type==='date').forEach(f=>{
      const inp = document.getElementById('f_'+f.key);
      const hint = document.getElementById('bshint_'+f.key);
      if(inp && hint) inp.addEventListener('input', ()=>{ hint.textContent = bsLabel(inp.value); });
    });
  } else {
    document.getElementById('editHeaderBtn').addEventListener('click', startEditHeader);
  }
  document.getElementById('deleteCaseBtn').addEventListener('click', ()=>deleteCase(c.caseID));

  bindAccordionHandlers();
  bindGridHandlers(c);
}

function fieldDisplayBlock(f, c){
  const raw = c[f.key];
  let valueHtml;
  if(raw === '' || raw == null){
    valueHtml = `<div class="field-value muted">—</div>`;
  } else if(f.type === 'date'){
    const bs = bsLabel(raw);
    valueHtml = `<div class="field-value">${escapeHtml(raw)}</div>${bs?`<div class="field-bs">${escapeHtml(bs)}</div>`:''}`;
  } else {
    valueHtml = `<div class="field-value">${escapeHtml(raw)}</div>`;
  }
  return `<div><div class="field-label">${f.label}</div>${valueHtml}</div>`;
}
function fieldEditBlock(f, c){
  if(f.type === 'date'){
    const bs = bsLabel(c[f.key]);
    return `<div>
      <div class="field-label">${f.label}</div>
      <input class="field-input" type="date" id="f_${f.key}" value="${escapeHtml(c[f.key])}">
      <div class="field-hint" id="bshint_${f.key}">${bs ? escapeHtml(bs) : ''}</div>
    </div>`;
  }
  return `<div>
    <div class="field-label">${f.label}</div>
    <input class="field-input" id="f_${f.key}" value="${escapeHtml(c[f.key])}" placeholder="${escapeHtml(f.placeholder||'')}">
  </div>`;
}

function headerFieldsDisplay(c){
  return `
    <div class="field-grid">
      <div><div class="field-label">Case ID</div><div class="field-value">${escapeHtml(c.caseID)}</div></div>
      ${HEADER_FIELDS.map(f=>fieldDisplayBlock(f,c)).join('')}
    </div>
    <div class="field-grid section-gap">
      <div style="grid-column:1/-1;" class="subhead">Insurance</div>
      ${INSURANCE_FIELDS.map(f=>fieldDisplayBlock(f,c)).join('')}
    </div>
    <div class="field-grid section-gap">
      <div style="grid-column:1/-1;" class="subhead">Insured Party</div>
      ${INSURED_FIELDS.map(f=>fieldDisplayBlock(f,c)).join('')}
    </div>
  `;
}
function headerFieldsEdit(c){
  return `
    <div class="field-grid">
      <div><div class="field-label">Case ID</div><input class="field-input" id="fCaseId" value="${escapeHtml(c.caseID)}"></div>
      ${HEADER_FIELDS.map(f=>fieldEditBlock(f,c)).join('')}
    </div>
    <div class="field-grid section-gap">
      <div style="grid-column:1/-1;" class="subhead">Insurance</div>
      ${INSURANCE_FIELDS.map(f=>fieldEditBlock(f,c)).join('')}
    </div>
    <div class="field-grid section-gap">
      <div style="grid-column:1/-1;" class="subhead">Insured Party</div>
      ${INSURED_FIELDS.map(f=>fieldEditBlock(f,c)).join('')}
    </div>
  `;
}

function section(key, title, bodyHtml){
  return `<div class="section ${collapsed[key]?'collapsed':''}" data-section="${key}">
    <button class="section-head" data-toggle="${key}" aria-expanded="${!collapsed[key]}">
      <span class="section-title">${title}</span>
      <span class="chevron">▾</span>
    </button>
    <div class="section-body">${bodyHtml}</div>
  </div>`;
}

function bindAccordionHandlers(){
  document.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.toggle;
      collapsed[key] = !collapsed[key];
      const sectionEl = btn.closest('.section');
      sectionEl.classList.toggle('collapsed', collapsed[key]);
      btn.setAttribute('aria-expanded', String(!collapsed[key]));
    });
  });
}

/* ---------- Generic row rendering (Visits / Status / Payment) ---------- */

function renderCell(f, row){
  if(f.type==='select'){
    return `<td class="input-cell"><select class="cell-select" data-f="${f.key}">
      <option value="">Select…</option>
      ${f.options.map(o=>`<option value="${o}" ${row[f.key]===o?'selected':''}>${o}</option>`).join('')}
    </select></td>`;
  }
  if(f.type==='date'){
    return `<td class="input-cell"><input class="cell-input" type="date" data-f="${f.key}" value="${escapeHtml(row[f.key])}">${f.bs?`<div class="cell-bs" data-bshint="${row.id}">${escapeHtml(bsLabel(row[f.key]))}</div>`:''}</td>`;
  }
  if(f.type==='number'){
    return `<td class="input-cell"><input class="cell-input" type="number" step="0.01" data-f="${f.key}" value="${escapeHtml(row[f.key])}" placeholder="0.00"></td>`;
  }
  return `<td class="input-cell"><input class="cell-input" data-f="${f.key}" value="${escapeHtml(row[f.key])}" placeholder="${escapeHtml(f.placeholder||'')}"></td>`;
}
function displayCell(f, row){
  const raw = row[f.key];
  if(raw===''||raw==null) return `<td class="display-cell muted">—</td>`;
  if(f.type==='date'){
    const bs = bsLabel(raw);
    return `<td class="display-cell">${escapeHtml(raw)}${bs?` <span class="cell-bs-inline">${escapeHtml(bs)}</span>`:''}</td>`;
  }
  if(f.type==='number'){
    const n = Number(raw);
    return `<td class="display-cell">${isNaN(n) ? escapeHtml(raw) : 'Rs. '+n.toFixed(2)}</td>`;
  }
  return `<td class="display-cell">${escapeHtml(raw)}</td>`;
}
function renderRow(tKey, row){
  const fields = FIELD_DEFS[tKey];
  const isEditing = editingRows.has(row.id);
  const cells = fields.map(f => isEditing ? renderCell(f, row) : displayCell(f, row)).join('');
  const actions = isEditing
    ? `<td class="col-actions"><button class="mini-btn save" data-saverow="${row.id}">Save</button><button class="mini-btn" data-cancelrow="${row.id}">Cancel</button></td>`
    : `<td class="col-actions"><button class="mini-btn" data-editrow="${row.id}">Edit</button><button class="del-btn" data-del="${row.id}" title="Delete row">×</button></td>`;
  return `<tr data-id="${row.id}" class="${isEditing?'editing-row':''}">${cells}${actions}</tr>`;
}
function gridWrap(tKey, headers, rows){
  const countLabel = `${rows.length} ${rows.length===1?'entry':'entries'}`;
  return `<div style="display:flex;justify-content:flex-end;margin-bottom:8px;"><span class="count-badge">${countLabel}</span></div>
  <table class="grid" data-table="${tKey}">
    <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}<th style="width:112px"></th></tr></thead>
    <tbody>
      ${rows.length ? rows.map(r=>renderRow(tKey, r)).join('') : `<tr><td class="empty-grid" colspan="${headers.length+1}">No entries yet.</td></tr>`}
    </tbody>
  </table>
  <button class="add-row-btn" data-add="${tKey}">+ Add row</button>`;
}
function visitTable(c){ return gridWrap('visits', ['Visit No','Visit Date','Visited By'], c.visits); }
function statusTable(c){ return gridWrap('statuses', ['Status','Date','Remarks'], c.statuses); }
function paymentTable(c){ return gridWrap('payments', ['Incurred Fee (Rs.)','Payment Status','Date','Remarks'], c.payments); }

function bindGridHandlers(c){
  document.querySelectorAll('table.grid').forEach(table=>{
    const tKey = table.dataset.table;
    table.querySelectorAll('input[type="date"][data-f]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const tr = inp.closest('tr');
        const hint = tr.querySelector(`[data-bshint="${tr.dataset.id}"]`);
        if(hint) hint.textContent = bsLabel(inp.value);
      });
    });
    table.querySelectorAll('button[data-editrow]').forEach(btn=>btn.addEventListener('click', ()=>startEditRow(tKey, c, btn.dataset.editrow)));
    table.querySelectorAll('button[data-saverow]').forEach(btn=>btn.addEventListener('click', ()=>saveRow(tKey, c, btn.dataset.saverow)));
    table.querySelectorAll('button[data-cancelrow]').forEach(btn=>btn.addEventListener('click', ()=>cancelEditRow(tKey, c, btn.dataset.cancelrow)));
    table.querySelectorAll('button[data-del]').forEach(btn=>btn.addEventListener('click', ()=>deleteRow(tKey, c, btn.dataset.del)));
  });
  document.querySelectorAll('button[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=>addDraftRow(btn.dataset.add, c));
  });
}

/* ---------- Init ---------- */

document.getElementById('newCaseBtn').addEventListener('click', newCase);
document.getElementById('search').addEventListener('input', renderSidebar);
document.getElementById('exportBtn').addEventListener('click', exportBackup);
document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importInput').click());
document.getElementById('importInput').addEventListener('change', (e)=>{
  if(e.target.files[0]) importBackup(e.target.files[0]);
  e.target.value = '';
});

loadData();
</script>
