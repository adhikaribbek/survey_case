<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A simple case register for insurance surveyors — track insurance, insured party, visit, status and payment details per case, stored right in your browser.">
<title>Case Register — Insurance Surveyor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231E2735'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' fill='%23F7F5EF' text-anchor='middle'%3E%C2%A7%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --paper:#F7F5EF;
    --paper-raised:#FFFFFF;
    --ink:#1E2735;
    --ink-soft:#586170;
    --line:#DCD5C0;
    --line-soft:#EAE4D2;
    --stamp-red:#AD3A2E;
    --stamp-red-soft:#F3E1DD;
    --ledger-green:#3A6B4C;
    --ledger-green-soft:#DDE9DF;
    --amber:#9C6B24;
    --amber-soft:#F1E3C6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;height:100%;font-size:14.5px;line-height:1.45;}
  #app{display:flex;min-height:100vh;}
  button{font-family:'Inter',sans-serif;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:300px;flex:0 0 300px;background:var(--paper-raised);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:100vh;
  }
  .sidebar-head{padding:22px 20px 16px;border-bottom:1px solid var(--line);}
  .brand-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);}
  .brand-title{font-family:'Zilla Slab',serif;font-size:21px;font-weight:700;margin-top:2px;line-height:1.2;}
  .total-row{margin-top:12px;display:flex;align-items:baseline;gap:8px;}
  .total-num{font-family:'Zilla Slab',serif;font-size:26px;font-weight:700;color:var(--stamp-red);}
  .total-label{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}

  .sidebar-controls{padding:14px 16px;border-bottom:1px solid var(--line);}
  #search{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:5px;
    background:var(--paper);font-size:13.5px;color:var(--ink);
  }
  #search:focus{outline:2px solid var(--ink);outline-offset:1px;}
  #newCaseBtn{
    width:100%;margin-top:10px;padding:10px 12px;border:none;border-radius:5px;
    background:var(--ink);color:#fff;font-weight:600;font-size:13.5px;
    cursor:pointer;letter-spacing:.01em;
  }
  #newCaseBtn:hover{background:#31404F;}
  #newCaseBtn:focus-visible{outline:2px solid var(--stamp-red);outline-offset:2px;}

  #caseList{flex:1;overflow-y:auto;padding:10px 0;}
  .case-tab{
    position:relative;margin:0 12px 8px;padding:10px 12px 10px 14px;
    background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line);
    border-radius:4px;cursor:pointer;transition:.12s;
  }
  .case-tab:hover{border-left-color:var(--ink-soft);}
  .case-tab.active{background:var(--ink);border-left-color:var(--stamp-red);}
  .case-tab.active .ct-id, .case-tab.active .ct-company{color:#fff;}
  .case-tab.active .ct-meta{color:#B9C0CC;}
  .ct-id{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .ct-company{font-family:'Zilla Slab',serif;font-size:15px;font-weight:600;margin-top:1px;}
  .ct-meta{font-size:11px;color:var(--ink-soft);margin-top:5px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .status-chip{
    display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;
    text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;
  }
  .empty-side{padding:24px 20px;color:var(--ink-soft);font-size:13px;line-height:1.6;}

  .sidebar-foot{border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
  #saveStatusRow{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);}
  .save-dot{width:7px;height:7px;border-radius:50%;background:var(--ledger-green);flex:0 0 7px;}
  .save-dot.busy{background:var(--amber);}
  .save-dot.err{background:var(--stamp-red);}
  .storage-note{font-size:10.5px;color:var(--ink-soft);line-height:1.5;}
  .backup-row{display:flex;gap:8px;}
  .ghost-btn{
    flex:1;border:1px solid var(--line);background:var(--paper-raised);border-radius:5px;padding:7px 8px;
    font-size:12px;cursor:pointer;color:var(--ink-soft);font-weight:500;
  }
  .ghost-btn:hover{border-color:var(--ink);color:var(--ink);}
  .ghost-btn:focus-visible{outline:2px solid var(--stamp-red);outline-offset:2px;}

  /* ---------- Main ---------- */
  #main{flex:1;padding:32px 40px 60px;min-width:0;}
  .no-case{max-width:440px;margin:80px auto;text-align:center;color:var(--ink-soft);}
  .no-case h2{font-family:'Zilla Slab',serif;color:var(--ink);font-size:22px;}
  .no-case p{font-size:14px;line-height:1.65;}

  .case-header{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding-bottom:20px;border-bottom:2px solid var(--ink);margin-bottom:24px;flex-wrap:wrap;gap:18px;
  }
  .ch-left{display:flex;gap:16px;align-items:flex-start;}
  .ch-badge{
    width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:'Zilla Slab',serif;font-weight:700;font-size:17px;
    flex:0 0 44px;
  }
  .ch-title-input{
    font-family:'Zilla Slab',serif;font-size:23px;font-weight:700;border:none;background:transparent;
    color:var(--ink);width:340px;max-width:100%;padding:2px 0;border-bottom:1px dashed transparent;
  }
  .ch-title-input:hover, .ch-title-input:focus{border-bottom-color:var(--line);outline:none;}
  .ch-sub{display:flex;gap:22px;margin-top:10px;flex-wrap:wrap;}
  .field-inline{display:flex;flex-direction:column;gap:3px;}
  .field-inline label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}
  .field-inline input{
    border:none;border-bottom:1px solid var(--line);background:transparent;font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;color:var(--ink);padding:3px 0;width:126px;
  }
  .field-inline input:focus{outline:none;border-bottom-color:var(--ink);}
  .bs-hint{font-size:10.5px;color:var(--ink-soft);margin-top:3px;font-family:'Inter';min-height:13px;}
  .bs-hint b{color:var(--ink);font-weight:600;}
  .ch-actions{display:flex;gap:8px;align-items:flex-start;}
  .icon-btn{
    border:1px solid var(--line);background:var(--paper-raised);border-radius:5px;padding:8px 12px;
    font-size:12px;cursor:pointer;color:var(--ink-soft);font-weight:500;
  }
  .icon-btn:hover{border-color:var(--stamp-red);color:var(--stamp-red);}
  .icon-btn:focus-visible{outline:2px solid var(--stamp-red);outline-offset:2px;}

  .stamp{
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:4px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
    border:1.5px solid currentColor;
  }
  .stamp.submitted{color:var(--ledger-green);}
  .stamp.process{color:var(--amber);}
  .stamp.none{color:var(--ink-soft);}

  /* accordion sections */
  .section{margin-bottom:16px;border:1px solid var(--line);border-radius:7px;background:var(--paper-raised);overflow:hidden;}
  .section-head{
    width:100%;display:flex;justify-content:space-between;align-items:center;
    padding:13px 16px;background:var(--paper-raised);border:none;cursor:pointer;text-align:left;

  .section-head:hover{background:#FBFAF5;}
  .section-head:focus-visible{outline:2px solid var(--stamp-red);outline-offset:-2px;}
  .section-title{

  table.grid tbody tr:hover{background:#FBFAF5;}

  .cell-bs{font-size:10.5px;color:var(--ink-soft);padding:0 12px 8px;margin-top:-4px;}
  td.col-del{width:34px;text-align:center;}
  .del-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;padding:6px 8px;line-height:1;}
  .del-btn:hover{color:var(--stamp-red);}
  .empty-grid{padding:18px 14px;font-size:13px;color:var(--ink-soft);font-style:italic;}

  .payment-box .section-head{background:var(--stamp-red-soft);}
  .payment-box .section-head:hover{background:#F0DAD5;}

  .toast{
    position:fixed;bottom:20px;right:26px;background:var(--ink);color:#fff;padding:10px 16px;
    border-radius:5px;font-size:12.5px;opacity:0;transform:translateY(8px);
    transition:.25s;pointer-events:none;z-index:50;max-width:320px;

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;}

  #importInput{display:none;}

    #app{flex-direction:column;}
    #sidebar{width:100%;flex:none;min-height:auto;max-height:380px;}

[31,32,31,32,31,30,30,30,29,29,30,31],2047:[31,31,31,32,31,31,30,29,30,29,30,30],2048:[31,31,32,31,31,31,30,29,30,29,30,30],2049:[31,32,31,32,31,30,30,30,29,29,30,30],2050:[31,32,31,32,31,30,30,30,29,30,29,31],2051:[31,31,31,32,31,31,30,29,30,29,30,30],2052:[31,31,32,31,31,31,30,29,30,29,30,30],2053:[31,32,31,32,31,30,30,30,29,29,30,30],2054:[31,32,31,32,31,30,30,30,29,30,29,31],2055:[31,31,32,31,31,31,30,29,30,29,30,30],2056:[31,31,32,31,32,30,30,29,30,29,30,30],2057:[31,32,31,32,31,30,30,30,29,29,30,31],2058:[30,32,31,32,31,30,30,30,29,30,29,31],2059:[31,31,32,31,31,31,30,29,30,29,30,30],2060:[31,31,32,32,31,30,30,29,30,29,30,30],2061:[31,32,31,32,31,30,30,30,29,29,30,31],2062:[30,32,31,32,31,31,29,30,29,30,29,31],2063:[31,31,32,31,31,31,30,29,30,29,30,30],2064:[31,31,32,32,31,30,30,29,30,29,30,30],2065:[31,32,31,32,31,30,30,30,29,29,30,31],2066:[31,31,31,32,31,31,29,30,30,29,29,31],2067:[31,31,32,31,31,31,30,29,30,29,30,30],2068:[31,31,32,32,31,30,30,29,30,29,30,30],2069:[31,32,31,32,31,30,30,30,29,29,30,31],2070:[31,31,31,32,31,31,29,30,30,29,30,30],2071:[31,31,32,31,31,31,30,29,30,29,30,30],2072:[31,32,31,32,31,30,30,29,30,29,30,30],2073:[31,32,31,32,31,30,30,30,29,29,30,31],2074:[31,31,31,32,31,31,30,29,30,29,30,30],2075:[31,31,32,31,31,31,30,29,30,29,30,30],2076:[31,32,31,32,31,30,30,30,29,29,30,30],2077:[31,32,31,32,31,30,30,30,29,30,29,31],2078:[31,31,31,32,31,31,30,29,30,29,30,30],2079:[31,31,32,31,31,31,30,29,30,29,30,30],2080:[31,32,31,32,31,30,30,30,29,29,30,30],2081:[31,32,31,32,31,30,30,30,29,30,29,31],2082:[31,31,32,31,31,31,30,29,30,29,30,30],2083:[31,31,32,31,31,31,30,29,30,29,30,30],2084:[31,32,31,32,31,30,30,30,29,29,30,31],2085:[30,32,31,32,31,30,30,30,29,30,29,31],2086:[31,31,32,31,31,31,30,29,30,29,30,30],2087:[31,31,32,31,31,31,30,30,29,30,30,30],2088:[30,31,32,32,30,31,30,30,29,30,30,30],2089:[30,32,31,32,31,30,30,30,29,30,30,30],2090:[30,32,31,32,31,30,30,30,29,30,30,30]};
const BS_MONTHS = ['Baisakh','Jestha','Asar','Shrawan','Bhadra','Aswin','Kartik','Mangsir','Poush','Magh','Falgun','Chaitra'];
const BS_EPOCH_AD = new Date('1943-04-14T00:00:00');

function adToBs(adStr){
  if(!adStr) return null;
  const target = new Date(adStr+'T00:00:00');
  if(isNaN(target)) return null;
  let days = Math.round((target - BS_EPOCH_AD)/86400000);
  if(days < 0) return null;
  let year = 2000, month = 0;
  while(true){
    if(month === 12){ month = 0; year++; }
    const yearData = BS_DATA[year];
    if(!yearData) return null; // outside supported range (pre-1943 or post-2034 AD)
    const mlen = yearData[month];
    if(days < mlen) break;
    days -= mlen; month++;
  }
  return {year, month: month+1, day: days+1};
}
function bsLabel(adStr){
  const r = adToBs(adStr);
  if(!r) return adStr ? 'B.S. date unavailable for this year' : '';
  return `B.S. ${r.day} ${BS_MONTHS[r.month-1]} ${r.year}`;
}

  insurance: {db:'insurance_details', cols:{insurer:'insurer', insuranceType:'insurance_type', claimDate:'claim_date', policyNo:'policy_no', claimNo:'claim_no'}},
  insured:   {db:'insured_details',   cols:{bankName:'bank_name', personName:'person_name'}},
  visits:    {db:'visit_details',     cols:{visitNo:'visit_no', visitDate:'visit_date', visitedBy:'visited_by'}},
  statuses:  {db:'status_details',    cols:{status:'status', date:'date', remarks:'remarks'}},
  payments:  {db:'payment_details',   cols:{incurredFee:'incurred_fee', payment:'payment', date:'date', remarks:'remarks'}},
};
const BLANK_PAYLOAD = {
  insurance: ()=>({insurer:'', insurance_type:'', claim_date:null, policy_no:'', claim_no:''}),
  insured:   ()=>({bank_name:'', person_name:''}),
  visits:    ()=>({visit_no:'', visit_date:null, visited_by:''}),
  statuses:  ()=>({status:'', date:null, remarks:''}),
  payments:  ()=>({incurred_fee:null, payment:'', date:null, remarks:''}),
};

function dbToJsRow(tKey, row){
  const out = {id: row.id};
  for(const [jsKey, dbCol] of Object.entries(TABLE_CONFIG[tKey].cols)) out[jsKey] = row[dbCol] ?? '';
  return out;
}

function isConfigured(){ return !!supa; }

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}

function setSaveStatus(mode, text){
  const dot = document.getElementById('saveDot');
  const label = document.getElementById('saveStatusText');
  if(!dot || !label) return;
  dot.className = 'save-dot' + (mode==='busy' ? ' busy' : mode==='err' ? ' err' : '');
  label.textContent = text;
}

function renderSetupScreen(){
  document.getElementById('app').innerHTML = `<div style="max-width:560px;margin:80px auto;padding:0 24px;text-align:center;">
    <h2 style="font-family:'Zilla Slab',serif;font-size:22px;">Connect your database to continue</h2>
    <p style="color:var(--ink-soft);line-height:1.65;font-size:14px;">
      This app stores its data in a Supabase project rather than in the browser. Open <code>config.js</code> in this
      folder, paste in your project's <b>Project URL</b> and <b>anon public key</b> (found under
      Supabase → Settings → API), save the file, and reload this page. Full steps are in <code>README.md</code>.
    </p>
  </div>`;
}

async function loadData(){
  if(!isConfigured()){ renderSetupScreen(); return; }
  setSaveStatus('busy','Connecting…');
  try{
    const [caseRes, insR, insdR, visR, staR, payR] = await Promise.all([
      supa.from('case_table').select('*').order('created_at', {ascending:false}),
      supa.from('insurance_details').select('*'),
      supa.from('insured_details').select('*'),
      supa.from('visit_details').select('*'),
      supa.from('status_details').select('*'),
      supa.from('payment_details').select('*'),
    ]);
    const firstError = [caseRes, insR, insdR, visR, staR, payR].map(r=>r.error).find(Boolean);
    if(firstError) throw firstError;
    cases = (caseRes.data||[]).map(r=>({
      caseID: r.case_id, companyName: r.company_name||'', dateOfAccident: r.date_of_accident||'', deputeDate: r.depute_date||'', createdAt: r.created_at,
      insurance: (insR.data||[]).filter(x=>x.case_id===r.case_id).map(x=>dbToJsRow('insurance',x)),
      insured:   (insdR.data||[]).filter(x=>x.case_id===r.case_id).map(x=>dbToJsRow('insured',x)),
      visits:    (visR.data||[]).filter(x=>x.case_id===r.case_id).map(x=>dbToJsRow('visits',x)),
      statuses:  (staR.data||[]).filter(x=>x.case_id===r.case_id).map(x=>dbToJsRow('statuses',x)),
      payments:  (payR.data||[]).filter(x=>x.case_id===r.case_id).map(x=>dbToJsRow('payments',x)),
    }));
    setSaveStatus('ok', cases.length ? 'Connected · all changes saved' : 'Connected · no cases yet');
  }catch(e){
    cases = [];
    setSaveStatus('err','Could not connect to the database');
    toast('Connection error: ' + (e.message||e));
  }
  if(cases.length && !selectedId) selectedId = cases[0].caseID;
  renderAll();
}

function nowStamp(){ return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }

async function updateCaseField(caseID, dbCol, value){
  setSaveStatus('busy','Saving…');
  const {error} = await supa.from('case_table').update({[dbCol]: value}).eq('case_id', caseID);
  if(error){ setSaveStatus('err','Not saved — retry'); toast('Could not save: '+error.message); }
  else setSaveStatus('ok','Saved · '+nowStamp());
}

async function renameCaseId(oldId, newId){
  setSaveStatus('busy','Saving…');
  const {error} = await supa.from('case_table').update({case_id:newId}).eq('case_id', oldId);
  if(error){ setSaveStatus('err','Not saved — retry'); toast('Could not rename case: '+error.message); return false; }
  setSaveStatus('ok','Saved · '+nowStamp());
  return true;
}

async function updateRowField(tKey, rowId, jsKey, value){
  const cfg = TABLE_CONFIG[tKey];
  const dbCol = cfg.cols[jsKey];
  let val = value;
  if(dbCol.endsWith('date')) val = value || null;
  if(dbCol === 'incurred_fee') val = (value===''||value==null) ? null : Number(value);
  setSaveStatus('busy','Saving…');
  const {error} = await supa.from(cfg.db).update({[dbCol]: val}).eq('id', rowId);
  if(error){ setSaveStatus('err','Not saved — retry'); toast('Could not save: '+error.message); }
  else setSaveStatus('ok','Saved · '+nowStamp());
}

async function addRow(tKey, caseID){
  const cfg = TABLE_CONFIG[tKey];
  const payload = {...BLANK_PAYLOAD[tKey](), case_id: caseID};
  setSaveStatus('busy','Saving…');
  const {data, error} = await supa.from(cfg.db).insert(payload).select().single();
  if(error){ setSaveStatus('err','Not saved — retry'); toast('Could not add row: '+error.message); return null; }
  setSaveStatus('ok','Saved · '+nowStamp());
  return dbToJsRow(tKey, data);
}

async function deleteRow(tKey, rowId){
  const cfg = TABLE_CONFIG[tKey];
  setSaveStatus('busy','Deleting…');
  const {error} = await supa.from(cfg.db).delete().eq('id', rowId);
  if(error){ setSaveStatus('err','Not saved — retry'); toast('Could not delete row: '+error.message); return false; }
  setSaveStatus('ok','Saved · '+nowStamp());
  return true;
}

function nextCaseId(){
  const nums = cases.map(c=>parseInt(c.caseID,10)).filter(n=>!isNaN(n));
  return String((nums.length?Math.max(...nums):1100)+1);
}

async function newCase(){
  const newId = nextCaseId();
  setSaveStatus('busy','Creating case…');
  const {data, error} = await supa.from('case_table')
    .insert({case_id:newId, company_name:'New Company', date_of_accident:null, depute_date:null})
    .select().single();
  if(error){ setSaveStatus('err','Not saved — retry'); toast('Could not create case: '+error.message); return; }
  cases.unshift({
    caseID: data.case_id, companyName: data.company_name||'', dateOfAccident: data.date_of_accident||'',
    deputeDate: data.depute_date||'', createdAt: data.created_at,
    insurance: [], insured: [], visits: [], statuses: [], payments: []
  });
  selectedId = newId;
  setSaveStatus('ok','Saved · '+nowStamp());
  renderAll();
}

async function deleteCase(id){
  if(!confirm('Delete case '+id+' and all its records? This cannot be undone.')) return;
  setSaveStatus('busy','Deleting…');
  const {error} = await supa.from('case_table').delete().eq('case_id', id);
  if(error){ setSaveStatus('err','Not saved — retry'); toast('Could not delete case: '+error.message); return; }
  cases = cases.filter(c=>c.caseID!==id);
  selectedId = cases.length?cases[0].caseID:null;
  setSaveStatus('ok','Saved · '+nowStamp());
  renderAll();
}

function getCase(id){ return cases.find(c=>c.caseID===id); }

function latestStatus(c){
  if(!c.statuses.length) return null;
  return [...c.statuses].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(-1)[0];
}
function statusClass(statusText){
  if(!statusText) return 'none';
  const s = statusText.toLowerCase();
  if(s.includes('submit')||s.includes('closed')||s.includes('final')) return 'submitted';
  if(s.includes('process')||s.includes('pending')||s.includes('query')) return 'process';
  return 'none';
}

/* ================= Backup / restore ================= */

function exportBackup(){
  if(!cases.length){ toast('Nothing to back up yet'); return; }
  const blob = new Blob([JSON.stringify(cases, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'case-register-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup file downloaded');
}

async function importBackup(file){
  const reader = new FileReader();
  reader.onload = async () => {
    let incoming;
    try{ incoming = JSON.parse(reader.result); }
    catch(e){ toast('That file is not valid JSON'); return; }
    if(!Array.isArray(incoming)){ toast('Backup file format not recognized'); return; }
    setSaveStatus('busy','Restoring…');
    let added = 0, skipped = 0;
    for(const c of incoming){
      if(!c || !c.caseID || getCase(String(c.caseID))){ skipped++; continue; }
      const {error: caseErr} = await supa.from('case_table').insert({
        case_id: String(c.caseID), company_name: c.companyName||'',
        date_of_accident: c.dateOfAccident||null, depute_date: c.deputeDate||null
      });
      if(caseErr){ skipped++; continue; }
      for(const tKey of ['insurance','insured','visits','statuses','payments']){
        const cfg = TABLE_CONFIG[tKey];
        const rows = Array.isArray(c[tKey]) ? c[tKey] : [];
        for(const r of rows){
          const payload = {case_id: String(c.caseID)};
          Object.entries(cfg.cols).forEach(([jsKey, dbCol])=>{
            let v = r[jsKey];
            if(dbCol.endsWith('date')) v = v || null;
            else if(dbCol === 'incurred_fee') v = (v===''||v==null) ? null : Number(v);
            else v = v ?? '';
            payload[dbCol] = v;
          });
          await supa.from(cfg.db).insert(payload);
        }
      }
      added++;
    }
    await loadData();
    toast(`Restored ${added} case${added===1?'':'s'}${skipped?`, skipped ${skipped} duplicate${skipped===1?'':'s'}`:''}`);
  };
  reader.readAsText(file);
}

/* ================= Rendering ================= */

function renderAll(){
  document.getElementById('totalCases').textContent = cases.length;
  renderSidebar();
  renderMain();
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderSidebar(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = document.getElementById('caseList');
  const filtered = cases.filter(c =>
    !q || c.caseID.toLowerCase().includes(q) || (c.companyName||'').toLowerCase().includes(q)
  );
  if(!filtered.length){
    list.innerHTML = `<div class="empty-side">${cases.length? 'No cases match your search.' : 'No cases yet. Click “+ New Case” to open your first file.'}</div>`;
    return;
  }
  list.innerHTML = filtered.map(c=>{
    const ls = latestStatus(c);
    const sc = ls ? statusClass(ls.status) : 'none';
    const bg = sc==='submitted' ? 'var(--ledger-green-soft)' : sc==='process' ? 'var(--amber-soft)' : 'var(--line-soft)';
    const fg = sc==='submitted' ? 'var(--ledger-green)' : sc==='process' ? 'var(--amber)' : 'var(--ink-soft)';
    const label = ls ? ls.status : 'No status';
    return `<div class="case-tab ${c.caseID===selectedId?'active':''}" data-id="${c.caseID}">
      <div class="ct-id">CASE #${escapeHtml(c.caseID)}</div>
      <div class="ct-company">${escapeHtml(c.companyName||'Untitled')}</div>
      <div class="ct-meta">
        <span>${escapeHtml(c.dateOfAccident||'—')}</span>
        <span class="status-chip" style="background:${bg};color:${fg}">${escapeHtml(label)}</span>
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('.case-tab').forEach(el=>{
    el.addEventListener('click',()=>{ selectedId = el.dataset.id; renderAll(); });
  });
}

function renderMain(){
  const main = document.getElementById('main');
  const c = getCase(selectedId);
  if(!c){
    main.innerHTML = `<div class="no-case">
      <h2>No case selected</h2>
      <p>Choose a case from the register on the left, or start a new file to begin logging insurance, insured party, visit, status and payment details. Your entries save automatically as you go, straight to the shared database.</p>
    </div>`;
    return;
  }
  const ls = latestStatus(c);
  const sc = ls ? statusClass(ls.status) : 'none';

  main.innerHTML = `
    <div class="case-header">
      <div class="ch-left">
        <div class="ch-badge">${escapeHtml((c.companyName||'?').slice(0,1).toUpperCase())}</div>
        <div>
          <input class="ch-title-input" id="fCompany" value="${escapeHtml(c.companyName)}" placeholder="Company / Client name">
          <div class="ch-sub">
            <div class="field-inline"><label>Case ID</label><input id="fCaseId" value="${escapeHtml(c.caseID)}"></div>
            <div class="field-inline">
              <label>Date of accident</label>
              <input type="date" id="fAccident" value="${escapeHtml(c.dateOfAccident)}">
              <div class="bs-hint" id="bsAccident">${bsLabel(c.dateOfAccident) ? '<b>'+bsLabel(c.dateOfAccident)+'</b>' : ''}</div>
            </div>
            <div class="field-inline">
              <label>Depute date</label>
              <input type="date" id="fDepute" value="${escapeHtml(c.deputeDate)}">
              <div class="bs-hint" id="bsDepute">${bsLabel(c.deputeDate) ? '<b>'+bsLabel(c.deputeDate)+'</b>' : ''}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="ch-actions">
        <span class="stamp ${sc}">${ls ? escapeHtml(ls.status) : 'No status'}</span>
        <button class="icon-btn" id="deleteCaseBtn">Delete case</button>
      </div>
    </div>

    ${section('insurance','Insurance Details','1', insuranceTable(c))}
    ${section('insured','Insured Details','2', insuredTable(c))}
    ${section('visits','Visit Details','3', visitTable(c))}
    ${section('statuses','Status Details','4', statusTable(c))}
    ${paymentSection(c)}
  `;

  bindText('fCompany', v=>{c.companyName=v; renderSidebar(); updateCaseField(c.caseID,'company_name',v);});
  bindText('fCaseId', async v=>{
    if(v && v!==c.caseID && !getCase(v)){
      const ok = await renameCaseId(c.caseID, v);
      if(ok){ c.caseID=v; selectedId=v; renderSidebar(); }
      else document.getElementById('fCaseId').value=c.caseID;
    } else if(v!==c.caseID){
      toast('Case ID must be unique'); document.getElementById('fCaseId').value=c.caseID;
    }
  });
  bindText('fAccident', v=>{
    c.dateOfAccident=v; renderSidebar();
    document.getElementById('bsAccident').innerHTML = bsLabel(v) ? '<b>'+bsLabel(v)+'</b>' : '';
    updateCaseField(c.caseID,'date_of_accident', v||null);
  });
  bindText('fDepute', v=>{
    c.deputeDate=v;
    document.getElementById('bsDepute').innerHTML = bsLabel(v) ? '<b>'+bsLabel(v)+'</b>' : '';
    updateCaseField(c.caseID,'depute_date', v||null);
  });
  document.getElementById('deleteCaseBtn').addEventListener('click',()=>deleteCase(c.caseID));

  bindGridHandlers(c);
  bindAccordionHandlers();
}

function section(key, title, num, bodyHtml){
  return `<div class="section ${collapsed[key]?'collapsed':''}" data-section="${key}">
    <button class="section-head" data-toggle="${key}" aria-expanded="${!collapsed[key]}">
      <span class="section-title"><span class="num">${num}</span>${title}</span>
      <span class="chevron">▾</span>
    </button>
    <div class="section-body">${bodyHtml}</div>
  </div>`;
}

function bindText(id, onChange){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('change', ()=>onChange(el.value));
}

function bindAccordionHandlers(){
  document.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.toggle;
      collapsed[key] = !collapsed[key];
      const sectionEl = btn.closest('.section');
      sectionEl.classList.toggle('collapsed', collapsed[key]);
      btn.setAttribute('aria-expanded', String(!collapsed[key]));
    });
  });
}

/* ---------- Grid table builders ---------- */

function gridWrap(tableName, headers, rows, rowRenderer, colSpan){
  const countLabel = `${rows.length} ${rows.length===1?'entry':'entries'}`;
  return `<div style="display:flex;justify-content:flex-end;margin-bottom:6px;"><span class="count-badge">${countLabel}</span></div>
  <table class="grid" data-table="${tableName}">
    <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}<th style="width:34px"></th></tr></thead>
    <tbody>
      ${rows.length ? rows.map(rowRenderer).join('') : `<tr><td class="empty-grid" colspan="${colSpan}">No entries yet.</td></tr>`}
    </tbody>
  </table>
  <button class="add-row-btn" data-add="${tableName}">+ Add row</button>`;
}

function bsRowHint(id, val){
  return `<div class="cell-bs" data-bshint="${id}">${bsLabel(val) ? bsLabel(val) : ''}</div>`;
}

function insuranceTable(c){
  return gridWrap('insurance',
    ['Insurer','Insurance Type','Claim Date','Policy No','Claim No'],
    c.insurance,
    r=>`<tr data-id="${r.id}">
      <td><input class="cell-input" data-f="insurer" value="${escapeHtml(r.insurer)}" placeholder="e.g. Nepal Life"></td>
      <td><input class="cell-input" data-f="insuranceType" value="${escapeHtml(r.insuranceType)}" placeholder="Third Party / Comprehensive"></td>
      <td><input class="cell-input" type="date" data-f="claimDate" data-bs="claimDate" value="${escapeHtml(r.claimDate)}">${bsRowHint(r.id, r.claimDate)}</td>
      <td><input class="cell-input" data-f="policyNo" value="${escapeHtml(r.policyNo)}"></td>
      <td><input class="cell-input" data-f="claimNo" value="${escapeHtml(r.claimNo)}"></td>
      <td class="col-del"><button class="del-btn" data-del="${r.id}" title="Delete row">×</button></td>
    </tr>`, 6);
}

function insuredTable(c){
  return gridWrap('insured',
    ['Insured Bank Name','Insured Person Name'],
    c.insured,
    r=>`<tr data-id="${r.id}">
      <td><input class="cell-input" data-f="bankName" value="${escapeHtml(r.bankName)}" placeholder="—"></td>
      <td><input class="cell-input" data-f="personName" value="${escapeHtml(r.personName)}" placeholder="Full name"></td>
      <td class="col-del"><button class="del-btn" data-del="${r.id}" title="Delete row">×</button></td>
    </tr>`, 3);
}

function visitTable(c){
  return gridWrap('visits',
    ['Visit No','Visit Date','Visited By'],
    c.visits,
    (r,i)=>`<tr data-id="${r.id}">
      <td><input class="cell-input" data-f="visitNo" value="${escapeHtml(r.visitNo)}" placeholder="${i+1}"></td>
      <td><input class="cell-input" type="date" data-f="visitDate" data-bs="visitDate" value="${escapeHtml(r.visitDate)}">${bsRowHint(r.id, r.visitDate)}</td>
      <td><input class="cell-input" data-f="visitedBy" value="${escapeHtml(r.visitedBy)}" placeholder="Surveyor name"></td>
      <td class="col-del"><button class="del-btn" data-del="${r.id}" title="Delete row">×</button></td>
    </tr>`, 4);
}

const STATUS_OPTIONS = ['PSR On Process','PSR Submitted','Report Finalized','Query Raised','Closed'];
function statusTable(c){
  return gridWrap('statuses',
    ['Status','Date','Remarks'],
    c.statuses,
    r=>`<tr data-id="${r.id}">
      <td><select class="cell-select" data-f="status">
        <option value="">Select…</option>
        ${STATUS_OPTIONS.map(o=>`<option value="${o}" ${r.status===o?'selected':''}>${o}</option>`).join('')}
      </select></td>
      <td><input class="cell-input" type="date" data-f="date" data-bs="date" value="${escapeHtml(r.date)}">${bsRowHint(r.id, r.date)}</td>
      <td><input class="cell-input" data-f="remarks" value="${escapeHtml(r.remarks)}" placeholder="Notes…"></td>
      <td class="col-del"><button class="del-btn" data-del="${r.id}" title="Delete row">×</button></td>
    </tr>`, 4);
}

const PAYMENT_OPTIONS = ['Pending','Received','Partially Received'];
function paymentSection(c){
  const body = gridWrap('payments',
    ['Incurred Fee (Rs.)','Payment Status','Date','Remarks'],
    c.payments,
    r=>`<tr data-id="${r.id}">
      <td><input class="cell-input" type="number" step="0.01" data-f="incurredFee" value="${escapeHtml(r.incurredFee)}" placeholder="0.00"></td>
      <td><select class="cell-select" data-f="payment">
        <option value="">Select…</option>
        ${PAYMENT_OPTIONS.map(o=>`<option value="${o}" ${r.payment===o?'selected':''}>${o}</option>`).join('')}
      </select></td>
      <td><input class="cell-input" type="date" data-f="date" data-bs="date" value="${escapeHtml(r.date)}">${bsRowHint(r.id, r.date)}</td>
      <td><input class="cell-input" data-f="remarks" value="${escapeHtml(r.remarks)}" placeholder="Notes…"></td>
      <td class="col-del"><button class="del-btn" data-del="${r.id}" title="Delete row">×</button></td>
    </tr>`, 5);
  return `<div class="section payment-box ${collapsed.payments?'collapsed':''}" data-section="payments">
    <button class="section-head" data-toggle="payments" aria-expanded="${!collapsed.payments}">
      <span class="section-title"><span class="num">5</span>Payment Details</span>
      <span class="chevron">▾</span>
    </button>
    <div class="section-body">${body}</div>
  </div>`;

/* ---------- Grid event binding ---------- */

function bindGridHandlers(c){
  document.querySelectorAll('table.grid').forEach(table=>{
    const tKey = table.dataset.table;
    table.querySelectorAll('input[data-f], select[data-f]').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const tr = inp.closest('tr');
        const rowId = tr.dataset.id;
        const row = c[tKey].find(r=>r.id===rowId);
        if(!row) return;
        row[inp.dataset.f] = inp.value;
        if(inp.dataset.bs){
          const hint = tr.querySelector(`[data-bshint="${rowId}"]`);
          if(hint) hint.textContent = bsLabel(inp.value);
        }
        await updateRowField(tKey, rowId, inp.dataset.f, inp.value);
        if(tKey==='statuses'){ renderMain(); renderSidebar(); }
      });
    });
    table.querySelectorAll('button[data-del]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const ok = await deleteRow(tKey, btn.dataset.del);
        if(ok){ c[tKey] = c[tKey].filter(r=>r.id!==btn.dataset.del); renderMain(); renderSidebar(); }
      });
    });
  });
  document.querySelectorAll('button[data-add]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const tKey = btn.dataset.add;
      collapsed[tKey] = false;
      const newRow = await addRow(tKey, c.caseID);
      if(newRow){ c[tKey].push(newRow); renderMain(); }
    });
  });
}

/* ---------- Init ---------- */

document.getElementById('newCaseBtn').addEventListener('click', newCase);
document.getElementById('search').addEventListener('input', renderSidebar);
document.getElementById('exportBtn').addEventListener('click', exportBackup);
document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importInput').click());
document.getElementById('importInput').addEventListener('change', (e)=>{
  if(e.target.files[0]) importBackup(e.target.files[0]);
  e.target.value = '';
});

loadData();
</script>
